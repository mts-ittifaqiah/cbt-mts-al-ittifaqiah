<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CBT Madrasah Pro — Sistem Ujian Berbasis Komputer Anti-Curang</title>
  <!-- Font Modern Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip untuk pembacaan file .docx & .xlsx modern -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-sky: #f4f7fb;
      --card-surface: #ffffff;
      --royal-start: #2563eb;
      --royal-end: #1d4ed8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background: #f4f7fb;
      color: #1e293b;
    }

    /* Isolasi Viewport Penuh agar tidak ada celah halaman Blogger di Desktop, PC, maupun Smartphone */
    #app-root {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 2147483640 !important;
      overflow: hidden !important;
      display: flex !important;
      background: #f4f7fb;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #modal-root {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2147483646 !important;
      pointer-events: none;
    }

    #modal-root:empty {
      display: none !important;
    }

    #toast-container {
      position: fixed !important;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      width: 100%;
      max-width: 440px;
      padding: 0 16px;
    }

    /* Gaya Clean Soft-Pastel UI */
    .neu-card {
      background: #ffffff;
      border: 1px solid #edf2f9;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .neu-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(37, 99, 235, 0.07);
    }

    .neu-card-static {
      background: #ffffff;
      border: 1px solid #edf2f9;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
    }

    .neu-stat-sky {
      background: linear-gradient(180deg, #f3f8ff 0%, #ffffff 100%);
      border: 1px solid #e3eeff;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.04);
    }

    .neu-stat-mint {
      background: linear-gradient(180deg, #f2fbf7 0%, #ffffff 100%);
      border: 1px solid #dcf5e9;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.04);
    }

    .neu-stat-teal {
      background: linear-gradient(180deg, #fffbf2 0%, #ffffff 100%);
      border: 1px solid #fef0d3;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.04);
    }

    .neu-stat-peach {
      background: linear-gradient(180deg, #fff5f6 0%, #ffffff 100%);
      border: 1px solid #ffe4e8;
      box-shadow: 0 4px 18px rgba(244, 63, 94, 0.04);
    }

    .neu-input {
      background: #f8fafd;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
    }

    .neu-input:focus {
      outline: none;
      background: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
    }

    .neu-btn-blue {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.22);
      transition: all 0.18s ease;
    }

    .neu-btn-blue:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .neu-btn-emerald {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.2);
      transition: all 0.18s ease;
    }

    .neu-btn-emerald:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .neu-btn-rose {
      background: #f43f5e;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(244, 63, 94, 0.2);
      transition: all 0.18s ease;
    }

    .neu-btn-rose:hover {
      background: #e11d48;
      transform: translateY(-1px);
    }

    /* =========================================================================
       ANIMASI MODERN, EFEK MIKRO-INTERAKSI, NOTIFIKASI TIMBUL & LOGIN RINGS
       ========================================================================= */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalSpringIn {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(12px);
      }
      70% {
        opacity: 1;
        transform: scale(1.015) translateY(-2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes toastPopIn {
      0% {
        opacity: 0;
        transform: translateY(-22px) scaleX(0.62) scaleY(0.82);
      }
      65% {
        opacity: 1;
        transform: translateY(3px) scaleX(1.02) scaleY(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleX(1) scaleY(1);
      }
    }

    @keyframes toastShrink {
      from { width: 100%; }
      to { width: 0%; }
    }

    @keyframes liquidDropPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.55);
      }
      50% {
        transform: scale(1.18);
        box-shadow: 0 0 0 6px rgba(249, 115, 22, 0);
      }
    }

    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.45; }
    }

    .anim-fade-up {
      animation: fadeSlideUp 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .anim-stagger-1 { animation-delay: 0.04s; }
    .anim-stagger-2 { animation-delay: 0.09s; }
    .anim-stagger-3 { animation-delay: 0.14s; }

    .anim-modal-pop {
      animation: modalSpringIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .toast-pop-card {
      animation: toastPopIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .toast-progress-bar {
      animation: toastShrink 3.8s linear forwards;
    }

    .live-dot-pulse {
      animation: pulseLive 1.8s infinite ease-in-out;
    }

    /* Gaya Portal Login Modern Q-CBT Edukasi */
    @keyframes qFloatGentle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.2deg); }
    }

    @keyframes leafSway {
      0%, 100% { transform: rotate(-3deg) translateY(0px); }
      50% { transform: rotate(4deg) translateY(-4px); }
    }

    @keyframes cloudDrift {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(18px); }
    }

    @keyframes btnShineSweep {
      0% { left: -75%; }
      45%, 100% { left: 135%; }
    }

    .qcbt-sky-stage {
      background: linear-gradient(155deg, #bae6fd 0%, #e0f2fe 38%, #dcfce7 78%, #bbf7d0 100%);
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .qcbt-glass-panel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(248, 252, 255, 0.88) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 24px 60px rgba(14, 116, 144, 0.14),
        0 4px 16px rgba(22, 163, 74, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .qcbt-pill-banner {
      background: linear-gradient(90deg, #16a34a 0%, #22c55e 55%, #15803d 100%);
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.28);
    }

    .qcbt-btn-masuk {
      position: relative;
      overflow: hidden;
      background: linear-gradient(90deg, #16a34a 0%, #0d9488 48%, #1e3a8a 100%);
      box-shadow: 0 10px 24px rgba(13, 148, 136, 0.32);
    }

    .qcbt-btn-masuk::after {
      content: '';
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.38) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-22deg);
      animation: btnShineSweep 4.2s infinite ease-in-out;
    }

    .qcbt-btn-masuk:hover {
      filter: brightness(1.06);
      transform: translateY(-1.5px);
      box-shadow: 0 14px 28px rgba(13, 148, 136, 0.38);
    }

    .qcbt-logo-float {
      animation: qFloatGentle 4.5s ease-in-out infinite;
    }

    .qcbt-leaf-sway {
      transform-origin: bottom left;
      animation: leafSway 5.5s ease-in-out infinite;
    }

    .qcbt-cloud-drift {
      animation: cloudDrift 11s ease-in-out infinite;
    }

    @keyframes qcbtMarqueeSlide {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    /* Animasi dinamis & organik untuk logo Q-CBT agar tidak kaku */
    @keyframes qcbtOrganicMorph {
      0%, 100% {
        border-radius: 44% 56% 52% 48% / 46% 42% 58% 54%;
        transform: rotate(-2deg) scale(1);
      }
      33% {
        border-radius: 54% 46% 43% 57% / 55% 48% 52% 45%;
        transform: rotate(2.5deg) scale(1.04);
      }
      66% {
        border-radius: 47% 53% 58% 42% / 43% 56% 44% 57%;
        transform: rotate(-1.5deg) scale(1.02);
      }
    }

    @keyframes qcbtSparkOrbit {
      0%, 100% {
        transform: translate(0px, 0px) scale(1) rotate(0deg);
      }
      50% {
        transform: translate(3px, -4px) scale(1.15) rotate(16deg);
      }
    }

    .qcbt-logo-morph {
      animation: qcbtOrganicMorph 6s ease-in-out infinite;
    }

    .qcbt-spark-float {
      animation: qcbtSparkOrbit 3.4s ease-in-out infinite;
    }

    .qcbt-marquee-track {
      display: flex;
      width: max-content;
      animation: qcbtMarqueeSlide 22s linear infinite;
    }

    .qcbt-marquee-track:hover {
      animation-play-state: paused;
    }

    .qcbt-wave-footer {
      background: linear-gradient(90deg, #15803d 0%, #16a34a 35%, #22c55e 70%, #15803d 100%);
      box-shadow: 0 -8px 28px rgba(21, 128, 61, 0.18);
    }

    /* Animasi Geser Kotak Form Login ke Samping Antar Peran */
    @keyframes loginSlideFromRight {
      0% {
        opacity: 0;
        transform: translateX(34px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes loginSlideFromLeft {
      0% {
        opacity: 0;
        transform: translateX(-34px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .login-box-slide-right {
      animation: loginSlideFromRight 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .login-box-slide-left {
      animation: loginSlideFromLeft 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* Gaya Dashboard Sage-Mint & Navigator Dual-Rail Pill */
    .sage-canvas-bg {
      background: linear-gradient(145deg, #f3f8ef 0%, #f7faf5 48%, #eef6e8 100%);
    }

    .sage-hero-banner {
      background: linear-gradient(120deg, #e5f4d9 0%, #f1f9eb 52%, #dff1d0 100%);
      border: 1px solid #d5ebc4;
      box-shadow: 0 8px 28px rgba(77, 124, 15, 0.06);
    }

    .sage-kpi-highlight {
      background: linear-gradient(145deg, #e4f4d7 0%, #f2faec 100%);
      border: 1px solid #d2e9bf;
      box-shadow: 0 4px 16px rgba(101, 163, 13, 0.06);
    }

    .sage-status-strip {
      background: linear-gradient(90deg, #dcf0cc 0%, #edf7e4 55%, #d6ecc4 100%);
      border: 1px solid #cbe4b7;
    }

    .nav-drawer-surface {
      background: linear-gradient(180deg, #f6f7f9 0%, #eff1f4 100%);
      border-right: 1px solid #e4e7ec;
    }

    .nav-rail-pill {
      background: #f5f6f8;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .liquid-drop-dot {
      background: #f97316;
      animation: liquidDropPulse 2s infinite ease-in-out;
    }

    .island-toast-pill {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.12), 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    .ws-card {
      background: #ffffff;
      border: 1px solid #ebf0e8;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.025);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .ws-card:hover {
      transform: translateY(-2px);
      border-color: #cfe6be;
      box-shadow: 0 10px 24px rgba(101, 163, 13, 0.08);
    }

    /* Gaya Dashboard & Sidebar Planti Hijau Daun (Adaptasi Madrasah) */
    .planti-shell {
      background: #f8faf7;
      color: #1e293b;
    }

    .planti-sidebar {
      background: #ffffff;
      border-right: 1px solid #eef2ec;
    }

    .planti-nav-active {
      color: #16a34a !important;
      font-weight: 800 !important;
      position: relative;
    }

    .planti-nav-active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3.5px;
      height: 22px;
      border-radius: 0 999px 999px 0;
      background: #22c55e;
    }

    .planti-hero-dark {
      background:
        radial-gradient(circle at 85% 20%, rgba(74, 222, 128, 0.24), transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(22, 163, 74, 0.35), transparent 50%),
        linear-gradient(125deg, #0b1f14 0%, #102b1c 55%, #09170f 100%);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
    }

    .planti-stats-lime {
      background: linear-gradient(135deg, #c7f39b 0%, #b3eb7f 55%, #9ee067 100%);
      box-shadow: 0 12px 26px rgba(132, 204, 22, 0.18);
    }

    .planti-help-card {
      background: linear-gradient(165deg, #d7f7b8 0%, #bce992 60%, #a5dc76 100%);
      border: 1px solid #c3ee9b;
    }

    .planti-card {
      background: #ffffff;
      border: 1px solid #eef2ec;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .planti-card:hover {
      transform: translateY(-2px);
      border-color: #bbf7d0;
      box-shadow: 0 10px 24px rgba(22, 163, 74, 0.08);
    }

    /* Gaya Sidebar Kartu Bersih (Adaptasi Gambar Referensi + Efek Menyala Aktif) */
    .clean-ref-sidebar {
      background: linear-gradient(180deg, #f8fafd 0%, #f1f5f9 100%);
      border-right: 1px solid #e2e8f0;
      box-shadow: 10px 0 30px rgba(15, 23, 42, 0.04);
    }

    .clean-ref-item {
      color: #64748b;
      font-weight: 700;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .clean-ref-item:hover {
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      font-weight: 800;
    }

    .clean-ref-item-active {
      background: linear-gradient(90deg, #dcfce7 0%, #ecfdf5 65%, #e0f2fe 100%) !important;
      color: #065f46 !important;
      font-weight: 800 !important;
      border-color: #86efac !important;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.2), inset 3px 0 0 #10b981;
    }

    /* Baris tabel menyala/berwarna saat dipilih atau di-klik dengan teks tebal & jelas */
    tbody tr {
      transition: background-color 0.18s ease, box-shadow 0.18s ease;
    }

    tbody tr.row-selected-glow,
    tbody tr:active {
      background: linear-gradient(90deg, #dcfce7 0%, #ecfdf5 60%, #e0f2fe 100%) !important;
      box-shadow: inset 4px 0 0 #10b981;
    }

    tbody tr.row-selected-glow td,
    tbody tr:active td {
      color: #064e3b !important;
      font-weight: 800 !important;
    }

    /* Variasi Tema Dashboard Khusus Agar Tidak Membosankan */
    .dash-theme-zamrud .planti-hero-dark {
      background:
        radial-gradient(circle at 85% 20%, rgba(74, 222, 128, 0.26), transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(22, 163, 74, 0.36), transparent 50%),
        linear-gradient(125deg, #0b2417 0%, #113321 55%, #091a11 100%);
    }
    .dash-theme-zamrud .planti-stats-lime {
      background: linear-gradient(135deg, #d1f7ad 0%, #baf08a 58%, #a2e36b 100%);
    }

    .dash-theme-senja {
      background: #faf8f5;
    }
    .dash-theme-senja .planti-hero-dark {
      background:
        radial-gradient(circle at 85% 20%, rgba(251, 191, 36, 0.25), transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(217, 119, 6, 0.35), transparent 50%),
        linear-gradient(125deg, #271b10 0%, #3d2815 55%, #1d140c 100%);
    }
    .dash-theme-senja .planti-stats-lime {
      background: linear-gradient(135deg, #fde68a 0%, #fcd34d 58%, #f59e0b 100%);
    }
    .dash-theme-senja .planti-card:hover {
      border-color: #fcd34d;
      box-shadow: 0 10px 24px rgba(217, 119, 6, 0.1);
    }

    .dash-theme-samudra {
      background: #f5f9fc;
    }
    .dash-theme-samudra .planti-hero-dark {
      background:
        radial-gradient(circle at 85% 20%, rgba(56, 189, 248, 0.26), transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(2, 132, 199, 0.35), transparent 50%),
        linear-gradient(125deg, #0c2238 0%, #123454 55%, #081829 100%);
    }
    .dash-theme-samudra .planti-stats-lime {
      background: linear-gradient(135deg, #bae6fd 0%, #7dd3fc 58%, #38bdf8 100%);
    }
    .dash-theme-samudra .planti-card:hover {
      border-color: #7dd3fc;
      box-shadow: 0 10px 24px rgba(2, 132, 199, 0.1);
    }

    .dash-theme-malam {
      background: #141816;
      color: #eef3f0;
    }
    .dash-theme-malam .planti-card {
      background: #1d2320;
      border-color: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
    }
    .dash-theme-malam .planti-card:hover {
      border-color: rgba(74, 222, 128, 0.45);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }
    .dash-theme-malam .planti-hero-dark {
      background:
        radial-gradient(circle at 85% 20%, rgba(52, 211, 153, 0.25), transparent 45%),
        linear-gradient(125deg, #091710 0%, #10291c 60%, #07120c 100%);
    }
    .dash-theme-malam .planti-stats-lime {
      background: linear-gradient(135deg, #86efac 0%, #4ade80 60%, #22c55e 100%);
    }

    /* Gaya Dark Dashboard Modern seperti Referensi + Nuansa Madrasah */
    .dark-ref-shell {
      background: #17161a;
      color: #f4f4f6;
    }

    .dark-ref-sidebar {
      background: #1e1d22;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dark-ref-card {
      background: #222126;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .dark-ref-card:hover {
      transform: translateY(-2px);
      border-color: rgba(16, 185, 129, 0.42);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38);
    }

    .dark-ref-active-pill {
      background: linear-gradient(90deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.28);
    }

    .dark-ref-promo-card {
      background: linear-gradient(135deg, #065f46 0%, #10b981 58%, #047857 100%);
      box-shadow: 0 12px 28px rgba(5, 150, 105, 0.28);
    }

    /* =========================================================================
       EFEK INTERAKSI DOWN-UP (TEKAN KE BAWAH & MEMANTUL KE ATAS) SAAT DIKLIK
       ========================================================================= */
    @keyframes tactileDownUp {
      0% {
        transform: translateY(0) scale(1);
      }
      32% {
        transform: translateY(4px) scale(0.95);
      }
      72% {
        transform: translateY(-2.5px) scale(1.02);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes iconDownUp {
      0% {
        transform: translateY(0) scale(1);
      }
      35% {
        transform: translateY(3px) scale(0.88);
      }
      75% {
        transform: translateY(-3px) scale(1.12);
      }
      100% {
        transform: translateY(0) scale(1);

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

          title: customTitle || (type === 'success' ? 'Berhasil Disimpan' : type === 'error' ? 'Peringatan Keamanan' : type === 'warning' ? 'Perhatian Sistem' : 'Info CBT'),
          message,
          time: nowTime,
          unread: true
        },
        ...(state.notifHistory || [])
      ].slice(0, 15);

      const container = document.getElementById('toast-container');
      if (!container) return;

      const themes = {
        success: {
          border: 'border-emerald-200/90',
          badgeBg: 'bg-emerald-500 text-white',
          dotColor: 'bg-emerald-500',
          bar: 'bg-emerald-500',
          title: customTitle || 'Berhasil',
          icon: uiIcon('shield-check', 'w-4 h-4')

        error: {

          dotColor: 'bg-orange-500',
          bar: 'bg-slate-800',
          title: customTitle || 'Notifikasi Sistem',

      const t = themes[type] || themes.info;
      const toast = document.createElement('div');
      toast.className = `toast-pop-card island-toast-pill pointer-events-auto relative overflow-hidden w-full rounded-full border ${t.border} px-3.5 py-2.5 pr-9 transition-all duration-300`;

      toast.querySelector('.btn-dismiss-toast')?.addEventListener('click', removeToast);

      setTimeout(removeToast, 3900);
    }

    async function hashPasswordSHA256(plainText) {
      const str = String(plainText || '');
      if (window.crypto && window.crypto.subtle) {
        const buf = new TextEncoder().encode(str);
        const digest = await window.crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(16);
    }

    function loadPreviewSnapshot() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.madrasah) Object.assign(state.madrasah, data.madrasah);
        if (Array.isArray(data.mapels)) state.mapels = data.mapels;
        if (Array.isArray(data.rombels)) state.rombels = data.rombels;
        if (Array.isArray(data.sesiList)) state.sesiList = data.sesiList;
        if (Array.isArray(data.users)) state.users = data.users;
        if (Array.isArray(data.bankSoal)) state.bankSoal = data.bankSoal;
        if (data.bankSoalKunci && typeof data.bankSoalKunci === 'object') state.bankSoalKunci = data.bankSoalKunci;
        if (Array.isArray(data.jadwalUjian)) state.jadwalUjian = data.jadwalUjian;
        if (Array.isArray(data.jadwalPengawas)) state.jadwalPengawas = data.jadwalPengawas;
        if (Array.isArray(data.examRecords)) state.examRecords = data.examRecords;
        if (data.beritaAcaraManual && typeof data.beritaAcaraManual === 'object') {
          Object.assign(state.beritaAcaraManual, data.beritaAcaraManual);
        }
        if (typeof data.kopLogoLembagaUrl === 'string') {
          state.kopLogoLembagaUrl = data.kopLogoLembagaUrl;
        }
        if (typeof data.kopLogoKemenagUrl === 'string') {
          state.kopLogoKemenagUrl = data.kopLogoKemenagUrl;
        }
      } catch (e) {}
    }

    function savePreviewSnapshot() {
      try {

          rombels: state.rombels,
          sesiList: state.sesiList,
          users: state.users,
          bankSoal: state.bankSoal,
          bankSoalKunci: state.bankSoalKunci,

    async function dbSaveDoc(colName, docId, data, stateArrayKey = null) {
      try {
        if (stateArrayKey && Array.isArray(state[stateArrayKey])) {
          const arr = state[stateArrayKey];
          const idx = arr.findIndex(item => item.id === docId);
          const payload = { ...data, id: data.id || docId };
          if (idx >= 0) arr[idx] = payload;
          else arr.push(payload);
        } else if (colName === 'bank_soal_kunci') {
          state.bankSoalKunci[docId] = data;
        } else if (colName === 'madrasah_settings') {
          Object.assign(state.madrasah, data);
        }

        if (IS_PREVIEW || !fbDb || !fbMod) {
          savePreviewSnapshot();
          return;
        }

        const ref = fbMod.doc(fbDb, colName, docId);
        await fbMod.setDoc(ref, data, { merge: true });
      } catch (err) {
        savePreviewSnapshot();
        showToast(`Penyimpanan lokal aktif: ${err.message || 'cek koneksi Firestore'}`, 'warning');
      }
    }

    async function dbDeleteDoc(colName, docId, stateArrayKey = null) {
      try {
        if (stateArrayKey && Array.isArray(state[stateArrayKey])) {
          state[stateArrayKey] = state[stateArrayKey].filter(item => item.id !== docId);
        }
        if (IS_PREVIEW || !fbDb || !fbMod) {
          savePreviewSnapshot();
          return;
        }
        await fbMod.deleteDoc(fbMod.doc(fbDb, colName, docId));
      } catch (err) {
        savePreviewSnapshot();
        showToast(`Penghapusan lokal dilakukan: ${err.message || ''}`, 'warning');
      }
    }

    function attachFirestoreListeners() {
      firestoreUnsubs.forEach(fn => {
        try { fn(); } catch (e) {}
      });
      firestoreUnsubs = [];
      if (!fbDb || !fbMod) return;

      const watchCol = (colName, onDocs) => {
        const unsub = fbMod.onSnapshot(fbMod.collection(fbDb, colName), (snap) => {
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          onDocs(list);
          // Lewati render ulang otomatis saat berada di menu monitoring agar layar tidak berkedip
          if (state.activeMenu !== 'monitoring') {
            renderApp();
          }
        }, () => {});
        firestoreUnsubs.push(unsub);
      };

      const unsubMadrasah = fbMod.onSnapshot(fbMod.doc(fbDb, 'madrasah_settings', 'profile'), (snap) => {
        if (snap.exists()) {
          Object.assign(state.madrasah, snap.data());
          renderApp();
        }
      }, () => {});
      firestoreUnsubs.push(unsubMadrasah);

      watchCol('mapels', list => { if (list.length > 0) state.mapels = list; });
      watchCol('rombels', list => { if (list.length > 0) state.rombels = list; });
      watchCol('sesi', list => { if (list.length > 0) state.sesiList = list; });
      watchCol('users', list => { if (list.length > 0) state.users = list; });
      watchCol('bank_soal', list => { if (list.length > 0) state.bankSoal = list; });
      watchCol('bank_soal_kunci', list => {
        list.forEach(item => {
          const { id, ...kunciData } = item;
          state.bankSoalKunci[id] = kunciData;
        });
      });
      watchCol('jadwal_ujian', list => { if (list.length > 0) state.jadwalUjian = list; });
      watchCol('jadwal_pengawas', list => { if (list.length > 0) state.jadwalPengawas = list; });
      watchCol('exam_records', list => { state.examRecords = list; });
    }

    async function initBackend() {
      loadPreviewSnapshot();

      if (IS_PREVIEW || !firebaseConfig.apiKey) {
        renderApp();
        return;
      }

      try {
        const [appMod, authMod, fsMod] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
          import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
        ]);
        const app = appMod.initializeApp(firebaseConfig);
        fbAuth = authMod.getAuth(app);
        fbDb = fsMod.getFirestore(app);
        fbMod = { ...authMod, ...fsMod };

        authMod.onAuthStateChanged(fbAuth, (fbUser) => {
          if (fbUser) {
            attachFirestoreListeners();
          }
          renderApp();
        });
      } catch (err) {
        showToast('Gagal memuat Firebase SDK, berjalan dalam mode lokal.', 'warning');
      }

      renderApp();
    }

    function bindLoginEvents() {
      document.getElementById('btn-toggle-login-pwd')?.addEventListener('click', () => {
        const inp = document.getElementById('inp-login-pwd');
        if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('btn-forgot-password')?.addEventListener('click', () => {
        showToast('Hubungi Proktor atau Administrator Madrasah untuk reset password akun Anda.', 'info', 'Bantuan Lupa Password');
      });

      const performLogin = async (rawId, rawPwd, remember = true) => {
        const idClean = String(rawId || '').trim().toLowerCase();
        const pwdClean = String(rawPwd || '').trim();
        if (!idClean || !pwdClean) {
          showToast('Masukkan Username / NIS dan Password terlebih dahulu.', 'warning');
          return;
        }

        if (!IS_PREVIEW && fbAuth && fbMod && idClean.includes('@')) {
          try {
            await fbMod.signInWithEmailAndPassword(fbAuth, idClean, pwdClean);
          } catch (fbErr) {
            // Lanjut cek pencocokan data pengguna di Firestore / state
          }
        } else if (!IS_PREVIEW && fbAuth && fbMod && !fbAuth.currentUser) {
          try {
            await fbMod.signInAnonymously(fbAuth);
          } catch (e) {}
        }

        const matched = state.users.find(u =>
          (String(u.username || '').toLowerCase() === idClean || String(u.email || '').toLowerCase() === idClean) &&
          String(u.password || '123456') === pwdClean
        );

        if (!matched) {
          showToast('Akun atau password tidak ditemukan. Periksa kembali kredensial Anda.', 'error');
          return;
        }

        if (matched.aktif === false) {
          showToast('Akun ini sedang dinonaktifkan oleh Administrator.', 'error');
          return;
        }

        try {
          if (remember) localStorage.setItem('qcbt_remembered_user', String(rawId || '').trim());
          else localStorage.removeItem('qcbt_remembered_user');
        } catch (e) {}

        state.currentUser = matched;
        state.impersonatorAdmin = null;
        state.activeMenu = 'dashboard';
        saveSessionState();
        showToast(`Selamat datang di Q-CBT, ${matched.nama}!`, 'success');
        renderApp();
      };

      document.getElementById('form-login')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        await performLogin(fd.get('identifier'), fd.get('password'), fd.get('remember') === 'on');
      });
    }

    function getTimeGreeting() {
      const hr = new Date().getHours();
      if (hr < 11) return 'Selamat Pagi';
      if (hr < 15) return 'Selamat Siang';
      if (hr < 18) return 'Selamat Sore';
      return 'Selamat Malam';
    }

        return `
          <div class="space-y-2">
            ${['A', 'B', 'C', 'D', 'E'].map(opt => `
              <div class="flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center font-extrabold text-xs">${opt}</span>
                <input name="opsi_${opt}" required="${opt !== 'E' ? 'true' : 'false'}" placeholder="Teks opsi ${opt}" class="neu-input flex-1 px-3 py-2 rounded-xl text-xs font-medium" />
              </div>
            `).join('')}
            <div>
              <label class="block font-bold text-slate-600 mb-1">Kunci Jawaban Benar</label>
              <select name="kunci_pg" class="neu-input w-full px-3 py-2 rounded-xl font-extrabold text-emerald-700">
                ${['A', 'B', 'C', 'D', 'E'].map(opt => `<option value="${opt}">Opsi ${opt}</option>`).join('')}
              </select>
            </div>
          </div>
        `;

    // =========================================================================
    // 15. PENILAIAN OTOMATIS 8 FORMAT SOAL & MONITORING HASIL NILAI
    // =========================================================================
    function calculateExamScore(jad, answers = {}) {
      if (!jad) return 0;
      const paket = state.bankSoal.find(b => b.id === jad.bankSoalId);
      const kunciMap = paket ? (state.bankSoalKunci[paket.id] || {}) : {};
      const soalList = paket?.soalList || [];
      if (soalList.length === 0) return 0;

      let totalBobot = 0;
      let earnedBobot = 0;

      const applyMultiSkema = (mode, rightCount, wrongCount, totalItems, bobot) => {
        if (totalItems <= 0) return 0;
        if (mode === 'penuh_saja') {
          return (rightCount === totalItems && wrongCount === 0) ? bobot : 0;
        }
        if (mode === 'proporsional_penalti') {
          const rawRatio = (rightCount - wrongCount) / totalItems;
          return Math.max(0, rawRatio) * bobot;
        }
        return (rightCount / totalItems) * bobot;
      };

      soalList.forEach(q => {
        const bobot = Number(q.bobot) || 10;
        totalBobot += bobot;
        const ans = answers?.[q.id];
        const kunci = kunciMap[q.id];
        if (ans === undefined || ans === null || ans === '' || kunci === undefined || kunci === null) return;

        if (q.tipe === 'PG' || q.tipe === 'MULTIMEDIA' || q.tipe === 'BS') {
          if (String(ans).trim().toLowerCase() === String(kunci).trim().toLowerCase()) earnedBobot += bobot;
        } else if (q.tipe === 'PG_KOMPLEKS') {
          const aArr = Array.isArray(ans) ? [...new Set(ans.map(x => String(x)))] : [];
          const kArr = Array.isArray(kunci) ? [...new Set(kunci.map(x => String(x)))] : [];
          if (aArr.length > 0 && kArr.length > 0) {
            const rightCount = aArr.filter(x => kArr.includes(x)).length;
            const wrongCount = aArr.filter(x => !kArr.includes(x)).length;
            earnedBobot += applyMultiSkema(q.scoringMode || 'proporsional', rightCount, wrongCount, kArr.length, bobot);
          }
        } else if (q.tipe === 'BS_MULTI') {
          const aArr = Array.isArray(ans) ? ans : [];
          const kArr = Array.isArray(kunci) ? kunci : [];
          if (kArr.length > 0) {
            let rightCount = 0;
            let wrongCount = 0;
            kArr.forEach((kv, i) => {
              const av = aArr[i];
              if (av !== undefined && av !== null && av !== '') {
                if (av === kv) rightCount++;
                else wrongCount++;
              }
            });
            earnedBobot += applyMultiSkema(q.scoringMode || 'proporsional', rightCount, wrongCount, kArr.length, bobot);
          }
        } else if (q.tipe === 'MENJODOHKAN') {
          if (typeof ans === 'object' && typeof kunci === 'object') {
            const keys = Object.keys(kunci);
            if (keys.length > 0) {
              let rightCount = 0;
              let wrongCount = 0;
              keys.forEach(k => {
                const av = String(ans[k] || '').trim();
                const kv = String(kunci[k] || '').trim();
                if (av !== '') {
                  if (av === kv) rightCount++;
                  else wrongCount++;
                }
              });
              earnedBobot += applyMultiSkema(q.scoringMode || 'proporsional', rightCount, wrongCount, keys.length, bobot);
            }
          }
        } else if (q.tipe === 'ISIAN') {
          if (String(ans).trim().toLowerCase() === String(kunci).trim().toLowerCase()) earnedBobot += bobot;
        } else if (q.tipe === 'ESAI') {
          const aStr = String(ans).trim().toLowerCase();
          const kStr = String(kunci).trim().toLowerCase();
          if (aStr && kStr && (aStr.includes(kStr) || kStr.includes(aStr))) earnedBobot += bobot;
        }
      });

      return totalBobot > 0 ? Math.round((earnedBobot / totalBobot) * 100) : 0;
    }

    function getResolvedStudentScore(jad, rec) {
      if (!rec) return null;
      if (typeof rec.manualSkor === 'number') return rec.manualSkor;
      if (typeof rec.skor === 'number' && (rec.skor > 0 || Object.keys(rec.answers || {}).length === 0)) {
        return rec.skor;
      }
      return calculateExamScore(jad, rec.answers || {});
    }

    // =========================================================================
    // 18. PORTAL UJIAN PESERTA (LOBBY & RUANG KERJA CBT ANTI-CURANG)
    // =========================================================================
    async function finishStudentExam(forcedByViolation = false) {
      const sess = state.activeExamSession;
      if (!sess || !state.currentUser) return;
      const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
      const finalSkor = calculateExamScore(jad, sess.answers || {});
      const recId = `rec_${sess.jadwalId}_${state.currentUser.id}`;

      await dbSaveDoc('exam_records', recId, {
        id: recId,
        jadwalId: sess.jadwalId,
        siswaId: state.currentUser.id,
        status: forcedByViolation ? 'terkunci' : 'selesai',
        skor: finalSkor,
        pelanggaran: sess.violations || 0,
        waktuSelesai: new Date().toTimeString().slice(0, 5),
        answers: sess.answers || {}
      }, 'examRecords');

      state.activeExamSession = null;
      state.currentQuestionIndex = 0;
      saveSessionState();

      if (forcedByViolation) {
        showToast('Ujian dikunci otomatis karena batas pelanggaran anti-curang tercapai!', 'error');
      } else {
        showToast(`Jawaban berhasil dikirim! Nilai Anda: ${finalSkor}`, 'success');
      }
      renderApp();
    }

        const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
        const soalList = paket?.soalList || [];
        const idx = Math.min(state.currentQuestionIndex, Math.max(0, soalList.length - 1));

        const curAns = curQ ? sess.answers?.[curQ.id] : null;
        const isRagu = curQ && (sess.raguIds || []).includes(curQ.id);
        const m = Math.floor((sess.remainingSec || 0) / 60);
        const s = (sess.remainingSec || 0) % 60;

        return `
          <div class="w-full h-full flex flex-col bg-[#f4f7fb] overflow-hidden select-none">

                      const answered = sess.answers?.[q.id] !== undefined && sess.answers?.[q.id] !== '' && !(Array.isArray(sess.answers?.[q.id]) && sess.answers[q.id].length === 0);
                      const ragu = (sess.raguIds || []).includes(q.id);

      const mySchedules = state.jadwalUjian.filter(j => (j.pesertaIds || []).includes(siswa.id));
      return `

              <button type="button" id="btn-logout" class="px-4 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-extrabold cursor-pointer">🚪 Keluar</button>

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (root) root.innerHTML = '';
    }

    function openConfirmModal(title, message, onConfirm, options = {}) {
      const root = document.getElementById('modal-root');
      if (!root) return;
      const variant = options.variant || (/hapus|reset|hentikan|kunci/i.test(title) ? 'danger' : 'save');
      const themes = {
        danger: {
          iconBg: 'bg-rose-100 text-rose-600',
          icon: uiIcon('trash', 'w-5 h-5'),
          btnClass: 'neu-btn-rose',
          btnLabel: options.confirmText || 'Ya, Hapus Sekarang'
        },
        save: {
          iconBg: 'bg-blue-100 text-blue-600',
          icon: uiIcon('save', 'w-5 h-5'),
          btnClass: 'neu-btn-blue',
          btnLabel: options.confirmText || 'Ya, Simpan Data'
        },
        success: {
          iconBg: 'bg-emerald-100 text-emerald-600',
          icon: uiIcon('shield-check', 'w-5 h-5'),
          btnClass: 'neu-btn-emerald',
          btnLabel: options.confirmText || 'Ya, Lanjutkan'
        }
      };
      const t = themes[variant] || themes.save;

      root.innerHTML = `
        <div class="pointer-events-auto fixed inset-0 z-[2147483646] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="anim-modal-pop neu-card-static w-full max-w-md rounded-3xl p-6 space-y-4">
            <div class="flex items-start gap-3.5">
              <div class="w-11 h-11 rounded-2xl ${t.iconBg} flex items-center justify-center text-xl shrink-0">
                ${t.icon}
              </div>
              <div class="space-y-1">
                <h3 class="text-base font-extrabold text-slate-800">${esc(title)}</h3>
                <p class="text-xs text-slate-500 leading-relaxed">${esc(message)}</p>
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
              <button type="button" id="btn-modal-cancel" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors cursor-pointer">
                Batal
              </button>
              <button type="button" id="btn-modal-ok" class="${t.btnClass} px-5 py-2.5 rounded-xl text-xs font-extrabold cursor-pointer">
                ${esc(t.btnLabel)}
              </button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('btn-modal-cancel')?.addEventListener('click', closeModal);
      document.getElementById('btn-modal-ok')?.addEventListener('click', async () => {
        closeModal();
        await onConfirm();
      });
    }

    function openEditUserModal(userId) {

      const root = document.getElementById('modal-root');
      if (!root) return;

      root.innerHTML = `
        <div class="pointer-events-auto fixed inset-0 z-[2147483646] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">

                <label class="block font-bold text-slate-600 mb-1">${user.role === 'siswa' ? 'Nomor Peserta' : 'Username'}</label>

              </div>
              <div>
                <label class="block font-bold text-slate-600 mb-1">Password Login</label>

                <input name="nama" value="${esc(user.nama)}" required class="neu-input w-full px-3.5 py-2.5 rounded-xl font-bold" />

              <div>
                <label class="block font-bold text-slate-600 mb-1">${user.role === 'siswa' ? 'NISN' : 'NIP'}</label>
                <input name="nomorInduk" value="${esc(user.role === 'siswa' ? (user.nisn || '') : (user.nip || ''))}" class="neu-input w-full px-3.5 py-2.5 rounded-xl font-mono font-bold" />
              </div>
              <div>
                <label class="block font-bold text-slate-600 mb-1">Email (Opsional)</label>
                <input name="email" value="${esc(user.email || '')}" class="neu-input w-full px-3.5 py-2.5 rounded-xl font-medium" />

                <div>
                  <label class="block font-bold text-slate-600 mb-1">Ruang Ujian</label>
                  <input name="ruang" value="${esc(user.ruang || 'Lab Komputer 01')}" class="neu-input w-full px-3 py-2.5 rounded-xl font-bold" />
                </div>
              ` : user.role === 'guru' ? `
                <div class="sm:col-span-2">
                  <label class="block font-bold text-slate-600 mb-1">Mata Pelajaran</label>
                  <select name="mapelKode" class="neu-input w-full px-3 py-2.5 rounded-xl font-bold">
                    ${state.mapels.map(m => `<option value="${esc(m.kode)}" ${user.mapelKode === m.kode ? 'selected' : ''}>${esc(m.kode)} — ${esc(m.nama)}</option>`).join('')}
                  </select>
                </div>
              ` : user.role === 'pengawas' ? `
                <div class="sm:col-span-2">
                  <label class="block font-bold text-slate-600 mb-1">Ruang Tugas</label>
                  <input name="ruang" value="${esc(user.ruang || 'Lab Komputer 01')}" class="neu-input w-full px-3.5 py-2.5 rounded-xl font-bold" />

                  <span>Status Akun Aktif (Dapat Login)</span>

      document.getElementById('btn-cancel-edit-user')?.addEventListener('click', closeModal);
      document.getElementById('form-edit-user')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newPwd = String(fd.get('password') || '123456').trim();

        const updated = {
          ...user,
          username: String(fd.get('username')).trim(),
          nama: String(fd.get('nama')).trim(),
          email: String(fd.get('email') || '').trim(),
          nisn: user.role === 'siswa' ? String(fd.get('nomorInduk') || '').trim() : (user.nisn || ''),

          password: newPwd,
          passwordHash,
          aktif: fd.get('aktif') === 'on'
        };
        await dbSaveDoc('users', user.id, updated, 'users');

          saveSessionState();
        }
        closeModal();
        showToast(`Data akun ${updated.nama} berhasil diperbarui!`, 'success');
        renderApp();
      });
    }

    async function parseSpreadsheetFile(file) {
      const text = await file.text();
      if (text.includes('<table')) {
        const doc = new DOMParser().parseFromString(text, 'text/html');
        return Array.from(doc.querySelectorAll('tr')).map(tr =>
          Array.from(tr.querySelectorAll('td,th')).map(td => td.textContent.trim())
        );
      }
      return text.split(/\r?\n/).filter(Boolean).map(line =>
        line.split(/[,;\t]/).map(c => c.replace(/^"|"$/g, '').trim())
      );
    }

    function parseSmartQuestions(rawText) {
      const blocks = String(rawText || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
      const result = [];
      blocks.forEach((blk, idx) => {
        const lines = blk.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return;
        const qText = lines[0].replace(/^\d+[\.\)]\s*/, '');
        const opsi = {};
        let kunci = 'A';
        lines.slice(1).forEach(ln => {
          const optMatch = ln.match(/^([A-E])[\.\)]\s*(.+)$/i);
          const keyMatch = ln.match(/^KUNCI\s*:\s*([A-E])/i);
          if (optMatch) opsi[optMatch[1].toUpperCase()] = optMatch[2].trim();
          else if (keyMatch) kunci = keyMatch[1].toUpperCase();
        });
        result.push({
          id: `q_imp_${Date.now()}_${idx}`,
          tipe: Object.keys(opsi).length > 0 ? 'PG' : 'ISIAN',
          pertanyaan: qText,
          opsi: Object.keys(opsi).length > 0 ? opsi : undefined,
          bobot: 10,
          kunci
        });
      });
      return result;
    }

    async function extractTextFromWordOrDocFile(file) {
      if (file.name.endsWith('.docx') && window.JSZip) {
        const zip = await window.JSZip.loadAsync(file);
        const xml = await zip.file('word/document.xml')?.async('string');
        if (xml) {
          const doc = new DOMParser().parseFromString(xml, 'text/xml');
          return Array.from(doc.getElementsByTagName('w:p')).map(p => p.textContent).join('\n');
        }
      }
      return await file.text();
    }

          async () => {
            const tipe = String(fd.get('tipe'));
            const qId = 'q_' + Date.now();
            const qObj = {
              id: qId,
              tipe,
              pertanyaan: String(fd.get('pertanyaan')).trim(),
              mediaUrl: String(fd.get('mediaUrl') || '').trim(),
              bobot: Number(fd.get('bobot')) || 10
            };
            let kunciVal = '';

            if (tipe === 'PG' || tipe === 'MULTIMEDIA') {
              qObj.opsi = {
                A: String(fd.get('opsi_A') || ''),
                B: String(fd.get('opsi_B') || ''),
                C: String(fd.get('opsi_C') || ''),
                D: String(fd.get('opsi_D') || ''),
                E: String(fd.get('opsi_E') || '')
              };
              kunciVal = String(fd.get('kunci_pg') || 'A');
            } else if (tipe === 'PG_KOMPLEKS') {
              qObj.scoringMode = String(fd.get('skema_pgk') || 'proporsional');
              qObj.opsi = {
                A: String(fd.get('opsi_A') || ''),
                B: String(fd.get('opsi_B') || ''),
                C: String(fd.get('opsi_C') || ''),
                D: String(fd.get('opsi_D') || ''),
                E: String(fd.get('opsi_E') || '')
              };
              kunciVal = fd.getAll('kunci_pgk');
            } else if (tipe === 'BS') {
              qObj.opsi = { A: 'Benar', B: 'Salah' };
              kunciVal = String(fd.get('kunci_bs') || 'Benar');
            } else if (tipe === 'BS_MULTI') {
              qObj.scoringMode = String(fd.get('skema_bsm') || 'proporsional');
              qObj.pernyataanMulti = [1, 2, 3].map(n => String(fd.get(`bsm_teks_${n}`) || '').trim()).filter(Boolean);
              kunciVal = [1, 2, 3].map(n => String(fd.get(`bsm_kunci_${n}`) || 'Benar')).slice(0, qObj.pernyataanMulti.length);
            } else if (tipe === 'MENJODOHKAN') {
              qObj.scoringMode = String(fd.get('skema_jodoh') || 'proporsional');
              qObj.pasangan = [];
              kunciVal = {};
              [1, 2, 3].forEach(n => {
                const k = String(fd.get(`jodoh_kiri_${n}`) || '').trim();
                const v = String(fd.get(`jodoh_kanan_${n}`) || '').trim();
                if (k && v) {
                  qObj.pasangan.push({ kiri: k, kanan: v });
                  kunciVal[k] = v;
                }
              });
            } else {
              kunciVal = String(fd.get('kunci_teks') || '').trim();
            }

            paket.soalList.push(qObj);
            if (!state.bankSoalKunci[paket.id]) state.bankSoalKunci[paket.id] = {};
            state.bankSoalKunci[paket.id][qId] = kunciVal;

            await dbSaveDoc('bank_soal', paket.id, paket, 'bankSoal');

            renderApp();
          },

            totalSoal,
            pelanggaran: rec?.pelanggaran || 0,
            nilaiTampil
          };
        });
        exportNilaiToExcel(jad, rowsData, kkm);
      });
      document.querySelectorAll('[data-dok-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.dokumenTab = btn.getAttribute('data-dok-tab') || 'berita_acara';
          renderApp();
        });
      });

      document.getElementById('sel-dok-jadwal')?.addEventListener('change', (e) => {
        state.beritaAcaraManual.jadwalId = e.target.value;
        const jad = state.jadwalUjian.find(j => j.id === state.beritaAcaraManual.jadwalId);
        const pgwAssign = state.jadwalPengawas.find(jp => jp.jadwalId === jad?.id);
        if (pgwAssign) {
          const pgw = state.users.find(u => u.id === pgwAssign.pengawasId);
          if (pgwAssign.ruang) state.beritaAcaraManual.ruang = pgwAssign.ruang;
          if (pgw?.nama) state.beritaAcaraManual.namaPengawas = pgw.nama;
          if (pgw?.nip) state.beritaAcaraManual.nipPengawas = pgw.nip;
        }
        savePreviewSnapshot();
        renderApp();
      });

      document.getElementById('sel-dok-rombel')?.addEventListener('change', (e) => {
        state.beritaAcaraManual.rombelId = e.target.value;
        savePreviewSnapshot();
        renderApp();
      });

      document.getElementById('btn-sync-hadir')?.addEventListener('click', () => {
        const ba = state.beritaAcaraManual;
        const jad = state.jadwalUjian.find(j => j.id === ba.jadwalId) || state.jadwalUjian[0];
        const siswaList = state.users.filter(u => u.role === 'siswa' && (!ba.rombelId || u.rombelId === ba.rombelId));
        const total = siswaList.length;
        const hadir = siswaList.filter(s => {
          const rec = state.examRecords.find(r => r.jadwalId === jad?.id && r.siswaId === s.id);
          return rec && rec.status !== 'belum_mulai';
        }).length;
        ba.jumlahSeharusnya = String(total);
        ba.jumlahHadir = String(hadir);
        ba.jumlahTidakHadir = String(Math.max(0, total - hadir));
        savePreviewSnapshot();
        showToast('Rekap jumlah hadir otomatis disinkronkan!', 'success');
        renderApp();
      });

      document.getElementById('btn-reset-dok-manual')?.addEventListener('click', () => {
        const m = state.madrasah;
        const adminUsr = state.users.find(u => u.role === 'admin');
        const pgwUsr = state.users.find(u => u.role === 'pengawas');
        state.beritaAcaraManual = {
          jadwalId: state.jadwalUjian[0]?.id || '',
          rombelId: '',
          kopInstansi: 'KEMENTERIAN AGAMA REPUBLIK INDONESIA',
          kopLembaga: m.nama,
          kopAlamat: `${m.alamat} • NPSN: ${m.npsn} • NSM: ${m.nsm}`,
          hariTanggal: new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
          ruang: pgwUsr?.ruang || 'Lab Komputer 01',
          jumlahSeharusnya: String(state.users.filter(u => u.role === 'siswa').length),
          jumlahHadir: '0',
          jumlahTidakHadir: '0',
          nomorTidakHadir: '-',
          catatanKejadian: 'Pelaksanaan ujian berjalan tertib, lancar, dan aman tanpa kendala teknis.',
          namaPengawas: pgwUsr?.nama || '-',
          nipPengawas: pgwUsr?.nip || '-',
          namaProktor: adminUsr?.nama || 'Administrator Utama',
          nipProktor: adminUsr?.nip || '-'
        };
        savePreviewSnapshot();
        showToast('Data berita acara & kop dikembalikan ke bawaan.', 'info');
        renderApp();
      });
      document.getElementById('sel-paper-size')?.addEventListener('change', (e) => {
        state.paperSize = e.target.value;
        renderApp();
      });
      document.getElementById('form-dokumen-manual')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        Object.assign(state.beritaAcaraManual, Object.fromEntries(fd.entries()));
        savePreviewSnapshot();
        showToast('Pratinjau dokumen diperbarui!', 'success');
        renderApp();
      });
      document.getElementById('btn-print-dok-pdf')?.addEventListener('click', () => {
        const area = document.getElementById('print-area');
        const staging = document.getElementById('print-staging-root');
        const appRoot = document.getElementById('app-root');
        if (!area || !staging) {
          window.print();
          return;
        }
        staging.innerHTML = area.innerHTML;
        staging.style.display = 'block';
        appRoot?.classList.add('printing-active');

        let cleanedUp = false;
        const cleanupPrint = () => {
          if (cleanedUp) return;
          cleanedUp = true;
          appRoot?.classList.remove('printing-active');
          staging.style.display = 'none';
          staging.innerHTML = '';
        };

        window.addEventListener('afterprint', cleanupPrint, { once: true });
        setTimeout(() => {
          try {
            window.print();
          } catch (e) {}
          setTimeout(cleanupPrint, 800);
        }, 50);
      });
      document.getElementById('btn-export-dok-word')?.addEventListener('click', () => {
        const area = document.getElementById('print-area');
        if (!area) return;
        const sheets = Array.from(area.querySelectorAll('.dok-rombel-sheet'));
        const wordContent = sheets.length > 0
          ? sheets.map((sh, i) => `<div style="${i > 0 ? 'page-break-before:always;' : ''}">${sh.innerHTML}</div>`).join('')
          : area.innerHTML;
        const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8" /></head><body>${wordContent}</body></html>`;
        const blob = new Blob(['\uFEFF' + html], { type: 'application/msword;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${state.dokumenTab}_${state.paperSize}.doc`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Dokumen Word (.doc) berhasil diunduh!', 'success');
      });

      document.getElementById('btn-download-backup')?.addEventListener('click', () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          madrasah: state.madrasah,
          mapels: state.mapels,
          rombels: state.rombels,
          sesiList: state.sesiList,
          users: state.users,
          bankSoal: state.bankSoal,
          bankSoalKunci: state.bankSoalKunci,
          jadwalUjian: state.jadwalUjian,
          jadwalPengawas: state.jadwalPengawas,
          examRecords: state.examRecords
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Backup_CBT_Madrasah_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Cadangan database berhasil diunduh!', 'success');
      });

      document.getElementById('inp-restore-backup')?.addEventListener('change', async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try {
          const data = JSON.parse(await f.text());
          if (data.madrasah) state.madrasah = data.madrasah;
          if (Array.isArray(data.mapels)) state.mapels = data.mapels;
          if (Array.isArray(data.rombels)) state.rombels = data.rombels;
          if (Array.isArray(data.sesiList)) state.sesiList = data.sesiList;
          if (Array.isArray(data.users)) state.users = data.users;
          if (Array.isArray(data.bankSoal)) state.bankSoal = data.bankSoal;
          if (data.bankSoalKunci) state.bankSoalKunci = data.bankSoalKunci;
          if (Array.isArray(data.jadwalUjian)) state.jadwalUjian = data.jadwalUjian;
          if (Array.isArray(data.jadwalPengawas)) state.jadwalPengawas = data.jadwalPengawas;
          if (Array.isArray(data.examRecords)) state.examRecords = data.examRecords;
          savePreviewSnapshot();
          showToast('Database berhasil dipulihkan!', 'success');
          renderApp();
        } catch (err) {
          showToast('Berkas JSON cadangan tidak valid.', 'error');
        }
      });
    }

    function bindStudentEvents() {
      document.querySelectorAll('[data-start-exam]').forEach(btn => {
        btn.addEventListener('click', () => {
          openExamTokenModal(btn.getAttribute('data-start-exam'));
        });
      });

      const sess = state.activeExamSession;
      if (!sess) return;
      const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
      const paket = state.bankSoal.find(b => b.id === jad?.bankSoalId);
      const soalList = paket?.soalList || [];
      const curQ = soalList[Math.min(state.currentQuestionIndex, Math.max(0, soalList.length - 1))];

      const saveCurrentAnswer = async (val) => {
        if (!curQ) return;
        sess.answers[curQ.id] = val;
        saveSessionState();
        const recId = `rec_${sess.jadwalId}_${state.currentUser.id}`;
        const existingRec = state.examRecords.find(r => r.id === recId || (r.jadwalId === sess.jadwalId && r.siswaId === state.currentUser.id));
        const liveSkor = calculateExamScore(jad, sess.answers);
        const payload = {
          id: recId,
          jadwalId: sess.jadwalId,
          siswaId: state.currentUser.id,
          status: 'mengerjakan',
          skor: liveSkor,
          pelanggaran: sess.violations || 0,
          waktuMulai: existingRec?.waktuMulai || new Date().toTimeString().slice(0, 5),
          answers: sess.answers
        };
        const arr = state.examRecords;
        const idx = arr.findIndex(item => item.id === recId);
        if (idx >= 0) arr[idx] = payload;
        else arr.push(payload);
        if (IS_PREVIEW || !fbDb || !fbMod) {
          savePreviewSnapshot();
          return;
        }
        try {
          await fbMod.setDoc(fbMod.doc(fbDb, 'exam_records', recId), payload, { merge: true });
        } catch (err) {
          savePreviewSnapshot();
        }
      };

      document.querySelectorAll('input[name="ans_pg"]').forEach(r => {
        r.addEventListener('change', async () => {
          await saveCurrentAnswer(r.value);
          renderApp();
        });
      });

      document.querySelectorAll('.ans-pgk').forEach(chk => {
        chk.addEventListener('change', async () => {
          const vals = Array.from(document.querySelectorAll('.ans-pgk:checked')).map(c => c.value);
          await saveCurrentAnswer(vals);
          renderApp();
        });
      });

      document.querySelectorAll('input[name="ans_bs"]').forEach(r => {
        r.addEventListener('change', async () => {
          await saveCurrentAnswer(r.value);
          renderApp();
        });
      });

      document.querySelectorAll('[data-bsm-idx]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const idx = Number(btn.getAttribute('data-bsm-idx'));
          const val = btn.getAttribute('data-bsm-val');
          const arr = Array.isArray(sess.answers[curQ.id]) ? [...sess.answers[curQ.id]] : [];
          arr[idx] = val;
          await saveCurrentAnswer(arr);
          renderApp();
        });
      });

      document.querySelectorAll('.ans-jodoh').forEach(sel => {
        sel.addEventListener('change', async () => {
          const kiri = sel.getAttribute('data-jodoh-kiri');
          const map = (sess.answers[curQ.id] && typeof sess.answers[curQ.id] === 'object') ? { ...sess.answers[curQ.id] } : {};
          map[kiri] = sel.value;
          await saveCurrentAnswer(map);
        });
      });

      document.getElementById('ans-teks-input')?.addEventListener('input', async (e) => {
        await saveCurrentAnswer(e.target.value);
      });

      document.getElementById('btn-prev-soal')?.addEventListener('click', () => {
        if (state.currentQuestionIndex > 0) {
          state.currentQuestionIndex--;
          saveSessionState();
          renderApp();
        }
      });

      document.getElementById('btn-next-soal')?.addEventListener('click', () => {
        if (state.currentQuestionIndex < soalList.length - 1) {
          state.currentQuestionIndex++;
          saveSessionState();
          renderApp();
        }
      });

      document.querySelectorAll('[data-jump-soal]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentQuestionIndex = Number(btn.getAttribute('data-jump-soal'));
          saveSessionState();
          renderApp();
        });
      });

      document.getElementById('btn-toggle-ragu')?.addEventListener('click', () => {
        if (!curQ) return;
        const list = sess.raguIds || [];
        sess.raguIds = list.includes(curQ.id) ? list.filter(x => x !== curQ.id) : [...list, curQ.id];
        saveSessionState();
        renderApp();
      });

      document.getElementById('btn-trigger-fullscreen')?.addEventListener('click', requestSafeFullscreen);

      const triggerFinishConfirm = () => {
        openConfirmModal('Kirim Jawaban Ujian', 'Apakah Anda yakin telah memeriksa seluruh jawaban dan ingin mengakhiri ujian ini?', async () => {
          await finishStudentExam(false);
        }, { variant: 'success', confirmText: 'Ya, Kirim Jawaban' });
      };
      document.getElementById('btn-finish-exam')?.addEventListener('click', triggerFinishConfirm);
      document.getElementById('btn-finish-exam-side')?.addEventListener('click', triggerFinishConfirm);
    }

    function renderApp() {
      isolateViewportFromBlogger();
      const root = document.getElementById('app-root');
      if (!root) return;

      // Jangan merender ulang form login saat pengguna sedang mengetikkan username/password
      if (!state.currentUser) {
        const activeEl = document.activeElement;
        const isTypingLogin = root.querySelector('#form-login') && activeEl && activeEl.closest('#form-login');
        if (isTypingLogin) return;
        root.innerHTML = renderLoginView();
        bindLoginEvents();
        return;
      }

      if (state.currentUser.role === 'siswa') {
        root.innerHTML = renderStudentPortalView();
        bindGlobalEvents();
        bindStudentEvents();
        return;
      }

      let viewHtml = '';
      switch (state.activeMenu) {
        case 'siswa':
          state.usersTab = 'siswa';
          viewHtml = renderUsersView();
          break;
        case 'guru':
          state.usersTab = 'guru';
          viewHtml = renderUsersView();
          break;
        case 'pengawas':
          state.usersTab = 'pengawas';
          viewHtml = renderUsersView();
          break;
        case 'admin':
          state.usersTab = 'admin';
          viewHtml = renderUsersView();
          break;
        case 'madrasah': viewHtml = renderMadrasahView(); break;
        case 'master': viewHtml = renderMasterView(); break;
        case 'users': viewHtml = renderUsersView(); break;
        case 'kartu_peserta': viewHtml = renderKartuPesertaView(); break;
        case 'bank_soal': viewHtml = renderBankSoalView(); break;
        case 'jadwal': viewHtml = renderJadwalView(); break;
        case 'jadwal_pengawas': viewHtml = renderJadwalPengawasView(); break;
        case 'monitoring': viewHtml = renderMonitoringView(); break;
        case 'dokumen': viewHtml = renderDokumenView(); break;
        case 'backup': viewHtml = renderBackupRestoreView(); break;
        default: viewHtml = renderDashboardView();
      }

      root.innerHTML = renderAppShell(viewHtml);
      bindGlobalEvents();
      if (lastClickedSelector) {
        const activeEl = root.querySelector(lastClickedSelector);
        if (activeEl) applyDownUpAnimation(activeEl);
      }
    }

    // =========================================================================
    // 22. TIMER & PERISAI ANTI-CURANG VISIBILITYCHANGE
    // =========================================================================
    setInterval(async () => {
      const sess = state.activeExamSession;
      if (!sess || state.currentUser?.role !== 'siswa') return;
      sess.remainingSec = Math.max(0, (sess.remainingSec || 0) - 1);
      saveSessionState();

      const badge = document.getElementById('exam-timer-badge');
      if (badge) {
        const m = Math.floor(sess.remainingSec / 60);
        const s = sess.remainingSec % 60;
        badge.textContent = `⏱️ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      if (sess.remainingSec === 0) {
        await finishStudentExam(false);
      }
    }, 1000);

    document.addEventListener('visibilitychange', async () => {
      if (document.hidden && state.activeExamSession && state.currentUser?.role === 'siswa') {
        const sess = state.activeExamSession;
        const jad = state.jadwalUjian.find(j => j.id === sess.jadwalId);
        if (!jad || !jad.antiCurang) return;

        sess.violations = (sess.violations || 0) + 1;
        saveSessionState();
        const limit = jad.batasPelanggaran || 3;
        const recId = `rec_${sess.jadwalId}_${state.currentUser.id}`;
        const violationPayload = {
          id: recId,
          jadwalId: sess.jadwalId,
          siswaId: state.currentUser.id,
          status: sess.violations >= limit ? 'terkunci' : 'mengerjakan',
          pelanggaran: sess.violations,
          answers: sess.answers
        };
        const idx = state.examRecords.findIndex(item => item.id === recId);
        if (idx >= 0) state.examRecords[idx] = { ...state.examRecords[idx], ...violationPayload };
        else state.examRecords.push(violationPayload);
        if (IS_PREVIEW || !fbDb || !fbMod) {
          savePreviewSnapshot();
        } else {
          try {
            await fbMod.setDoc(fbMod.doc(fbDb, 'exam_records', recId), violationPayload, { merge: true });
          } catch (err) {
            savePreviewSnapshot();
          }
        }

        if (sess.violations >= limit) {
          await finishStudentExam(true);
        } else {
          showToast(`PERINGATAN ANTI-CURANG (${sess.violations}/${limit}): Dilarang meninggalkan layar ujian!`, 'error');
          renderApp();
        }
      }
    });

    document.addEventListener('contextmenu', (e) => {
      if (state.activeExamSession && state.currentUser?.role === 'siswa') {
        e.preventDefault();
      }
    });

    restoreSessionState();
    initBackend();
  </script>
</body>
</html>
