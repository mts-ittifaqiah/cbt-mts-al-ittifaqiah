      openButirSoalModal(soalId = "") {
        const existing = soalId ? state.data.butirSoal.find((s) => s.id === soalId) : null;
        const parsedPairs = existing && existing.tipe_soal === "menjodohkan" ? parseMatchingPairs(existing).leftItems : [];
        state.modalFormState = {
          tipe_soal: existing?.tipe_soal || "pg",
          gambar_url: existing?.gambar_url || "",
          link_url: existing?.link_url || "",
          bs_wajib_alasan: existing?.opsi_c === "wajib_alasan",
          matching_pairs:
            parsedPairs.length >= 2
              ? parsedPairs.map((p) => ({ left: p.left, right: p.right }))
              : [
                  { left: "", right: "" },
                  { left: "", right: "" },
                  { left: "", right: "" }
                ]
        };
        state.modalHtml = this.renderButirSoalModalBody(soalId);
        render();
      },

      changeModalSoalTipe(newTipe, existingId = "") {
        state.modalFormState.tipe_soal = newTipe;
        state.modalHtml = this.renderButirSoalModalBody(existingId);
        render();
      },

      toggleBsReasonField(checked, existingId = "") {
        state.modalFormState.bs_wajib_alasan = checked;
        state.modalHtml = this.renderButirSoalModalBody(existingId);
        render();
      },

      addMatchingPairRow(existingId = "") {
        state.modalFormState.matching_pairs.push({ left: "", right: "" });
        state.modalHtml = this.renderButirSoalModalBody(existingId);
        render();
      },

      removeMatchingPairRow(idx, existingId = "") {
        state.modalFormState.matching_pairs.splice(idx, 1);
        state.modalHtml = this.renderButirSoalModalBody(existingId);
        render();
      },

      updateModalMatchingPair(idx, side, value) {
        if (state.modalFormState.matching_pairs[idx]) {
          state.modalFormState.matching_pairs[idx][side] = value;
        }
      },

      setModalGambarUrl(val) {
        state.modalFormState.gambar_url = val;
      },

      clearModalGambarUrl(existingId = "") {
        state.modalFormState.gambar_url = "";
        state.modalHtml = this.renderButirSoalModalBody(existingId);
        render();
      },

      async saveButirSoal(e, existingId = "") {
        e.preventDefault();
        const fd = new FormData(e.target);
        const bankId = state.selectedBankId;
        if (!bankId) return;

        const tipe = String(fd.get("tipe_soal") || state.modalFormState.tipe_soal || "pg");
        let opsiA = String(fd.get("opsi_a") || "").trim();
        let opsiB = String(fd.get("opsi_b") || "").trim();
        let opsiC = String(fd.get("opsi_c") || "").trim();
        let opsiD = String(fd.get("opsi_d") || "").trim();
        let opsiE = String(fd.get("opsi_e") || "").trim();
        let kunci = String(fd.get("kunci_jawaban") || "A").trim();

        if (tipe === "benar_salah") {
          opsiA = opsiA || "Benar";
          opsiB = opsiB || "Salah";
          opsiC = fd.get("bs_wajib_alasan") === "on" ? "wajib_alasan" : "tanpa_alasan";
          kunci = normalizeTrueFalseToken(kunci) || "BENAR";
        } else if (tipe === "menjodohkan") {
          const validPairs = state.modalFormState.matching_pairs.filter(
            (p) => String(p.left || "").trim() && String(p.right || "").trim()
          );
          if (validPairs.length < 2) {
            showToast("Isi minimal 2 pasangan lajur kiri dan lajur kanan untuk soal menjodohkan!", "error");
            return;
          }
          const serialized = validPairs.map((p) => `${p.left.trim()} => ${p.right.trim()}`).join("; ");
          opsiA = serialized;
          kunci = serialized;
        }

        const gambarUrl = String(fd.get("gambar_url") || state.modalFormState.gambar_url || "").trim();
        const linkUrl = String(fd.get("link_url") || state.modalFormState.link_url || "").trim();

        const existingCount = state.data.butirSoal.filter((s) => s.bank_soal_id === bankId).length;
        const payload = {
          id: existingId || generateId(),
          bank_soal_id: bankId,
          nomor_urut: existingId
            ? state.data.butirSoal.find((s) => s.id === existingId)?.nomor_urut || 1
            : existingCount + 1,
          tipe_soal: tipe,
          pertanyaan: String(fd.get("pertanyaan") || "").trim(),
          gambar_url: gambarUrl,
          link_url: linkUrl,
          opsi_a: opsiA,
          opsi_b: opsiB,
          opsi_c: opsiC,
          opsi_d: opsiD,
          opsi_e: opsiE,
          kunci_jawaban: kunci,
          bobot_nilai: Number(fd.get("bobot_nilai") || 10)
        };

        if (existingId) {
          const idx = state.data.butirSoal.findIndex((s) => s.id === existingId);
          if (idx >= 0) state.data.butirSoal[idx] = payload;
        } else {
          state.data.butirSoal.push(payload);
        }

        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          const { link_url: _omitLink, ...dbSafePayload } = payload;
          const { error } = await supabase.from("butir_soal").upsert(payload);
          if (error) {
            await supabase.from("butir_soal").upsert(dbSafePayload);
          }
        }
        state.modalHtml = null;
        showToast("Butir soal berhasil disimpan!", "success");
        render();
      },

      async deleteButirSoal(id) {
        state.data.butirSoal = state.data.butirSoal.filter((s) => s.id !== id);
        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          await supabase.from("butir_soal").delete().eq("id", id);
        }
        showToast("Butir soal dihapus.", "info");
        render();
      },

      // Jadwal & Token
      openJadwalModal(jadwalId = "") {
        const existing = jadwalId ? state.data.jadwal.find((j) => j.id === jadwalId) : null;
        const nowIso = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        const endIso = new Date(Date.now() + 90 * 60000 - new Date().getTimezoneOffset() * 60000)
          .toISOString()
          .slice(0, 16);

        const mulVal = existing?.waktu_mulai
          ? new Date(new Date(existing.waktu_mulai).getTime() - new Date().getTimezoneOffset() * 60000)
              .toISOString()
              .slice(0, 16)
          : nowIso;
        const selVal = existing?.waktu_selesai
          ? new Date(new Date(existing.waktu_selesai).getTime() - new Date().getTimezoneOffset() * 60000)
              .toISOString()
              .slice(0, 16)
          : endIso;

        state.modalHtml = `
          <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 text-xs my-auto">
              <div class="flex items-center justify-between">
                <h3 class="font-extrabold text-base text-slate-900">${existing ? "Edit Jadwal Ujian" : "Buat Jadwal Ujian Baru"}</h3>
                <button type="button" onclick="window.appActions.closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
              </div>
              <form onsubmit="window.appActions.saveJadwal(event, '${existing?.id || ""}')" class="space-y-3">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Nama Sesi / Ujian *</label>
                  <input type="text" name="nama_ujian" required value="${escapeHtml(existing?.nama_ujian || "")}" placeholder="Ujian Madrasah Al-Qur'an Hadis" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-bold" />
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Paket Bank Soal *</label>
                    <select name="bank_soal_id" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-bold bg-white">
                      ${state.data.bankSoal
                        .map(
                          (b) =>
                            `<option value="${b.id}" ${existing?.bank_soal_id === b.id ? "selected" : ""}>${escapeHtml(b.judul_paket)}</option>`
                        )
                        .join("")}
                    </select>
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Rombel / Kelas *</label>
                    <select name="kelas_id" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-bold bg-white">
                      ${state.data.kelas
                        .map(
                          (k) =>
                            `<option value="${k.id}" ${existing?.kelas_id === k.id ? "selected" : ""}>${escapeHtml(k.nama_kelas)}</option>`
                        )
                        .join("")}
                    </select>
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Target Sesi Peserta</label>
                    <select name="sesi_ujian" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-bold bg-white">
                      ${["Semua Sesi", "Sesi 1", "Sesi 2", "Sesi 3", "Sesi 4"]
                        .map(
                          (s) =>
                            `<option value="${s}" ${(existing?.sesi_ujian || "Semua Sesi") === s ? "selected" : ""}>${s}</option>`
                        )
                        .join("")}
                    </select>
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Durasi Ujian (Menit) *</label>
                    <input type="number" name="durasi_menit" required value="${existing?.durasi_menit || 60}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-extrabold" />
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-2.5">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Waktu Mulai *</label>
                    <input type="datetime-local" name="waktu_mulai" required value="${mulVal}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-semibold" />
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Waktu Selesai *</label>
                    <input type="datetime-local" name="waktu_selesai" required value="${selVal}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-semibold" />
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-2.5 pt-1">
                  <label class="flex items-center gap-2 font-bold text-slate-700">
                    <input type="checkbox" name="acak_soal" ${existing?.acak_soal ? "checked" : ""} /> Acak Urutan Soal
                  </label>
                  <label class="flex items-center gap-2 font-bold text-slate-700">
                    <input type="checkbox" name="tampilkan_nilai" ${existing?.tampilkan_nilai !== false ? "checked" : ""} /> Tampilkan Nilai ke Siswa
                  </label>
                  <label class="flex items-center gap-2 font-bold text-slate-700">
                    <input type="checkbox" name="anti_contek" ${existing?.anti_contek !== false ? "checked" : ""} /> Aktifkan Perisai Anti-Curang
                  </label>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-700">Maks. Pelanggaran:</span>
                    <input type="number" min="1" max="10" name="max_pelanggaran" value="${existing?.max_pelanggaran || 3}" class="w-14 px-2 py-1 rounded-lg border border-slate-200 font-extrabold text-center" />
                  </div>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-[#1D63ED] text-white font-extrabold">Simpan Jadwal Ujian</button>
              </form>
            </div>
          </div>
        `;
        render();
      },

      async saveJadwal(e, existingId = "") {
        e.preventDefault();
        const fd = new FormData(e.target);
        const existing = existingId ? state.data.jadwal.find((j) => j.id === existingId) : null;
        const payload = {
          id: existingId || generateId(),
          nama_ujian: String(fd.get("nama_ujian") || "").trim(),
          bank_soal_id: String(fd.get("bank_soal_id") || ""),
          kelas_id: String(fd.get("kelas_id") || ""),
          sesi_ujian: String(fd.get("sesi_ujian") || "Semua Sesi"),
          waktu_mulai: new Date(String(fd.get("waktu_mulai"))).toISOString(),
          waktu_selesai: new Date(String(fd.get("waktu_selesai"))).toISOString(),
          durasi_menit: Number(fd.get("durasi_menit") || 60),
          token_ujian: existing?.token_ujian || generateRandomToken(),
          token_auto_rotate: true,
          token_interval_menit: 15,
          token_updated_at: existing?.token_updated_at || new Date().toISOString(),
          anti_contek: fd.get("anti_contek") === "on",
          wajib_fullscreen: fd.get("anti_contek") === "on",
          max_pelanggaran: Math.max(1, Number(fd.get("max_pelanggaran") || 3)),
          acak_soal: fd.get("acak_soal") === "on",
          acak_opsi: false,
          tampilkan_nilai: fd.get("tampilkan_nilai") === "on",
          pengawas_ids: existing?.pengawas_ids || [],
          peserta_ids: existing?.peserta_ids,
          status_jadwal: "aktif"
        };

        if (existingId) {
          const idx = state.data.jadwal.findIndex((j) => j.id === existingId);
          if (idx >= 0) state.data.jadwal[idx] = payload;
        } else {
          state.data.jadwal.unshift(payload);
        }

        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          const { peserta_ids: _omitPesertaIds, ...dbSafeJadwal } = payload;
          const { error } = await supabase.from("jadwal_ujian").upsert(payload);
          if (error) {
            await supabase.from("jadwal_ujian").upsert(dbSafeJadwal);
          }
        }
        state.modalHtml = null;
        showToast("Jadwal ujian berhasil disimpan!", "success");
        render();
      },

      async regenerateJadwalToken(id) {
        const j = state.data.jadwal.find((x) => x.id === id);
        if (!j) return;
        j.token_ujian = generateRandomToken();
        j.token_updated_at = new Date().toISOString();
        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          await supabase
            .from("jadwal_ujian")
            .update({ token_ujian: j.token_ujian, token_updated_at: j.token_updated_at })
            .eq("id", id);
        }
        showToast(`Token baru: ${j.token_ujian}`, "success");
        render();
      },

      async deleteJadwal(id) {
        state.data.jadwal = state.data.jadwal.filter((j) => j.id !== id);
        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          await supabase.from("jadwal_ujian").delete().eq("id", id);
        }
        showToast("Jadwal ujian dihapus.", "info");
        render();
      },

      // Monitoring & Kontrol Sesi Siswa (Selesaikan & Paksa Berhenti)
      toggleSelectMonitoringSesi(sesiId) {
        if (state.selectedMonitoringSesiIds.includes(sesiId)) {
          state.selectedMonitoringSesiIds = state.selectedMonitoringSesiIds.filter((id) => id !== sesiId);
        } else {
          state.selectedMonitoringSesiIds.push(sesiId);
        }
        render();
      },

      toggleSelectAllMonitoringSesi(checked) {
        const targetJadwal =
          state.data.jadwal.find((j) => j.id === state.monitoringJadwalId) || state.data.jadwal[0] || null;
        if (!checked || !targetJadwal) {
          state.selectedMonitoringSesiIds = [];
          render();
          return;
        }
        state.selectedMonitoringSesiIds = state.data.sesi
          .filter((s) => s.jadwal_id === targetJadwal.id)
          .map((s) => s.id);
        render();
      },

      confirmSingleSessionControl(actionType, sesiId) {
        const sesi = state.data.sesi.find((s) => s.id === sesiId);
        if (!sesi) return;
        const peserta = state.data.peserta.find((p) => p.id === sesi.peserta_id);
        const isForceStop = actionType === "force_stop";

        state.modalHtml = `
          <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl ${isForceStop ? "bg-rose-50 text-rose-600" : "bg-emerald-50 text-emerald-600"} flex items-center justify-center shrink-0">
                  <i data-lucide="${isForceStop ? "octagon-alert" : "check-circle-2"}" class="w-5 h-5"></i>
                </div>
                <div>
                  <h3 class="font-extrabold text-base text-slate-900">${isForceStop ? "Konfirmasi Paksa Berhenti Ujian" : "Konfirmasi Selesaikan Ujian"}</h3>
                  <p class="text-slate-500 mt-0.5">${escapeHtml(peserta?.nama_siswa || "-")} (${escapeHtml(peserta?.nomor_peserta || "-")})</p>
                </div>
              </div>
              <p class="text-slate-600 leading-relaxed">
                ${
                  isForceStop

      async executeSessionControl(actionType, sesiIds) {
        const isForceStop = actionType === "force_stop";
        const nowIso = new Date().toISOString();
        const waktuLabel = new Date().toLocaleTimeString("id-ID", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });

        for (const id of sesiIds) {
          const sesi = state.data.sesi.find((s) => s.id === id);
          if (!sesi) continue;
          recalculateSessionScore(sesi.id);
          if (isForceStop) {
            sesi.status_sesi = "terkunci";
            sesi.log_pelanggaran = Array.isArray(sesi.log_pelanggaran)
              ? [...sesi.log_pelanggaran, { waktu: waktuLabel, alasan: "Dihentikan paksa oleh Pengawas/Admin" }]
              : [{ waktu: waktuLabel, alasan: "Dihentikan paksa oleh Pengawas/Admin" }];
          } else {
            sesi.status_sesi = "selesai";
            sesi.waktu_submit = nowIso;
          }

          if (!IS_PREVIEW && supabase) {
            await supabase
              .from("sesi_peserta")
              .update({
                status_sesi: sesi.status_sesi,
                waktu_submit: sesi.waktu_submit,
                log_pelanggaran: sesi.log_pelanggaran,
                nilai_pg: sesi.nilai_pg,
                nilai_esai: sesi.nilai_esai,
                nilai_akhir: sesi.nilai_akhir
              })
              .eq("id", sesi.id);
          }
        }

        saveStateToLocalStorage();
        state.selectedMonitoringSesiIds = [];
        state.modalHtml = null;
        showToast(
          isForceStop
            ? `${sesiIds.length} sesi peserta berhasil dihentikan paksa!`
            : `${sesiIds.length} sesi peserta berhasil diselesaikan!`,
          isForceStop ? "error" : "success"
        );
        render();
      },

      async unlockStudentSession(sesiId) {
        const sesi = state.data.sesi.find((s) => s.id === sesiId);
        if (!sesi) return;
        sesi.status_sesi = "mengerjakan";
        sesi.jumlah_pelanggaran = 0;
        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          await supabase
            .from("sesi_peserta")
            .update({ status_sesi: "mengerjakan", jumlah_pelanggaran: 0 })
            .eq("id", sesiId);
        }
        showToast("Kunci sesi peserta berhasil dibuka!", "success");
        render();
      },

      async updateEsaiScore(sesiId, soalId, rawScore) {
        const skor = Number(rawScore || 0);
        let jw = state.data.jawaban.find((x) => x.sesi_id === sesiId && x.soal_id === soalId);
        if (!jw) {
          jw = {
            id: generateId(),
            sesi_id: sesiId,
            soal_id: soalId,
            jawaban_dipilih: "",
            is_ragu: false,
            is_benar: skor > 0,
            skor_diperoleh: skor
          };
          state.data.jawaban.push(jw);
        } else {
          jw.skor_diperoleh = skor;
          jw.is_benar = skor > 0;
        }
        recalculateSessionScore(sesiId);
        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          await supabase.from("jawaban_peserta").upsert(jw);
          const sesi = state.data.sesi.find((s) => s.id === sesiId);
          if (sesi) {
            await supabase
              .from("sesi_peserta")
              .update({ nilai_pg: sesi.nilai_pg, nilai_esai: sesi.nilai_esai, nilai_akhir: sesi.nilai_akhir })
              .eq("id", sesiId);
          }
        }
        showToast("Skor esai & nilai akhir diperbarui!", "success");
        render();
      },

      async verifyTokenAndStart(e, jadwalId) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const inputToken = String(fd.get("token") || "").trim().toUpperCase();
        const jadwal = state.data.jadwal.find((j) => j.id === jadwalId);
        if (!jadwal) return;

        if (inputToken !== String(jadwal.token_ujian || "").trim().toUpperCase()) {
          showToast("Token ujian tidak sesuai! Periksa kembali token dari pengawas.", "error");
          return;
        }

        const peserta = state.currentUser.profile;
        const bank = state.data.bankSoal.find((b) => b.id === jadwal.bank_soal_id) || null;
        let soalList = state.data.butirSoal
          .filter((s) => s.bank_soal_id === jadwal.bank_soal_id)
          .sort((a, b) => Number(a.nomor_urut || 0) - Number(b.nomor_urut || 0));

        if (soalList.length === 0) {
          showToast("Paket soal ini belum memiliki butir soal. Hubungi panitia ujian.", "error");
          return;
        }

        if (jadwal.acak_soal) {
          soalList = [...soalList].sort(() => Math.random() - 0.5);
        }

        let sesi = state.data.sesi.find((s) => s.jadwal_id === jadwal.id && s.peserta_id === peserta.id);
        if (!sesi) {
          sesi = {
            id: generateId(),
            jadwal_id: jadwal.id,
            peserta_id: peserta.id,
            waktu_login: new Date().toISOString(),
            waktu_submit: null,
            status_sesi: "mengerjakan",
            jumlah_pelanggaran: 0,
            log_pelanggaran: [],
            nilai_pg: 0,
            nilai_esai: 0,
            nilai_akhir: 0
          };
          state.data.sesi.unshift(sesi);
          saveStateToLocalStorage();
          if (!IS_PREVIEW && supabase) {
            await supabase.from("sesi_peserta").upsert(sesi);
          }
        }

        state.modalHtml = null;
        state.antiCurangModalAlert = null;
        state.activeExam = {
          jadwal,
          bank,
          peserta,
          sesi,
          soalList,
          currentIndex: 0,
          remainingSeconds: Number(jadwal.durasi_menit || 60) * 60
        };
        saveAuthSessionToStorage();

        if (jadwal.wajib_fullscreen !== false && document.documentElement.requestFullscreen) {
          try {
            await document.documentElement.requestFullscreen();
          } catch (_err) {}
        }
        render();
      },

      async acknowledgeAntiCurangWarning() {
        state.antiCurangModalAlert = null;
        if (state.activeExam?.jadwal?.wajib_fullscreen !== false && document.documentElement.requestFullscreen) {
          try {
            await document.documentElement.requestFullscreen();
          } catch (_err) {}
        }
        render();
      },

      adjustExamFont(delta) {
        if (delta === 0) state.examFontScale = 1;
        else state.examFontScale = Math.max(0.85, Math.min(1.4, Number((state.examFontScale + delta).toFixed(2))));
        render();
      },

      goToExamQuestion(idx) {
        if (!state.activeExam) return;
        const max = state.activeExam.soalList.length - 1;
        state.activeExam.currentIndex = Math.max(0, Math.min(max, idx));
        saveAuthSessionToStorage();
        render();
      },

      async toggleRaguSoal() {
        if (!state.activeExam) return;
        const { sesi, soalList, currentIndex } = state.activeExam;
        const soal = soalList[currentIndex];
        let jw = state.data.jawaban.find((x) => x.sesi_id === sesi.id && x.soal_id === soal.id);
        if (!jw) {
          jw = {
            id: generateId(),
            sesi_id: sesi.id,
            soal_id: soal.id,
            jawaban_dipilih: "",
            is_ragu: true,
            is_benar: false,
            skor_diperoleh: 0
          };
          state.data.jawaban.push(jw);
        } else {
          jw.is_ragu = !jw.is_ragu;
        }
        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          await supabase.from("jawaban_peserta").upsert(jw, { onConflict: "sesi_id,soal_id" });
        }
        render();
      },

      async saveAnswer(value, silent = false) {
        if (!state.activeExam) return;
        const { sesi, soalList, currentIndex } = state.activeExam;
        const soal = soalList[currentIndex];
        if (!soal) return;

        const { isBenar, skor } = gradeQuestion(soal, value);
        let jw = state.data.jawaban.find((x) => x.sesi_id === sesi.id && x.soal_id === soal.id);
        if (!jw) {
          jw = {
            id: generateId(),
            sesi_id: sesi.id,
            soal_id: soal.id,
            jawaban_dipilih: String(value),
            is_ragu: false,
            is_benar: isBenar,
            skor_diperoleh: skor
          };
          state.data.jawaban.push(jw);
        } else {
          jw.jawaban_dipilih = String(value);
          jw.is_benar = isBenar;
          jw.skor_diperoleh = skor;
        }

        recalculateSessionScore(sesi.id);
        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          await supabase.from("jawaban_peserta").upsert(jw, { onConflict: "sesi_id,soal_id" });
        }
        if (!silent) render();
      },

      togglePgkOption(opt) {
        if (!state.activeExam) return;
        const { sesi, soalList, currentIndex } = state.activeExam;
        const soal = soalList[currentIndex];
        const jw = state.data.jawaban.find((x) => x.sesi_id === sesi.id && x.soal_id === soal.id);
        const set = new Set(String(jw?.jawaban_dipilih || "").toUpperCase().split(",").map((x) => x.trim()).filter(Boolean));
        if (set.has(opt)) set.delete(opt);
        else set.add(opt);
        window.appActions.saveAnswer([...set].sort().join(","));
      },

      saveTrueFalseAnswer(choice) {
        if (!state.activeExam) return;
        const { sesi, soalList, currentIndex } = state.activeExam;
        const soal = soalList[currentIndex];
        const jw = state.data.jawaban.find((x) => x.sesi_id === sesi.id && x.soal_id === soal.id);
        const existingParts = String(jw?.jawaban_dipilih || "").split("||");
        const reason = existingParts.slice(1).join("||");
        const combined = reason ? `${choice}||${reason}` : choice;
        window.appActions.saveAnswer(combined);
      },

      saveTrueFalseReason(reasonText) {
        if (!state.activeExam) return;
        const { sesi, soalList, currentIndex } = state.activeExam;
        const soal = soalList[currentIndex];
        const jw = state.data.jawaban.find((x) => x.sesi_id === sesi.id && x.soal_id === soal.id);
        const choice = normalizeTrueFalseToken(jw?.jawaban_dipilih || "") || "";
        const combined = `${choice}||${String(reasonText || "")}`;
        window.appActions.saveAnswer(combined, true);
      },

      updateMatchingPair(leftKey, rightVal) {
        if (!state.activeExam) return;
        const { sesi, soalList, currentIndex } = state.activeExam;
        const soal = soalList[currentIndex];
        const jw = state.data.jawaban.find((x) => x.sesi_id === sesi.id && x.soal_id === soal.id);
        const map = parseStudentMatchingMap(jw?.jawaban_dipilih || "");
        if (rightVal) map[leftKey] = rightVal;
        else delete map[leftKey];
        const serialized = Object.entries(map)
          .map(([k, v]) => `${k}=>${v}`)
          .join("; ");
        window.appActions.saveAnswer(serialized);
      },

      confirmFinishExam() {
        state.modalHtml = `
          <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
              <h3 class="font-extrabold text-base text-slate-900">Konfirmasi Pengumpulan Ujian</h3>
              <p class="text-slate-600">Apakah Anda yakin ingin mengakhiri ujian dan mengumpulkan seluruh jawaban sekarang? Setelah dikumpulkan, jawaban tidak dapat diubah kembali.</p>
              <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" onclick="window.appActions.closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-extrabold">Periksa Kembali</button>
                <button type="button" onclick="window.appActions.finishStudentExam(false)" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold">Ya, Kumpulkan Sekarang</button>
              </div>
            </div>
          </div>
        `;
        render();
      },

      async finishStudentExam(autoSubmit = false) {
        if (!state.activeExam) return;
        const { sesi } = state.activeExam;
        recalculateSessionScore(sesi.id);
        sesi.status_sesi = "selesai";
        sesi.waktu_submit = new Date().toISOString();

        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          await supabase
            .from("sesi_peserta")
            .update({
              status_sesi: "selesai",
              waktu_submit: sesi.waktu_submit,
              nilai_pg: sesi.nilai_pg,
              nilai_esai: sesi.nilai_esai,
              nilai_akhir: sesi.nilai_akhir
            })
            .eq("id", sesi.id);
        }

        state.modalHtml = null;
        state.activeExam = null;
        saveAuthSessionToStorage();
        showToast(
          autoSubmit ? "Waktu habis! Jawaban ujian dikumpulkan otomatis." : "Ujian selesai dan jawaban berhasil dikumpulkan!",
          "success"
        );
        render();
      },

      openStudentResultModal(sesiId) {
        const sesi = state.data.sesi.find((s) => s.id === sesiId);
        if (!sesi) return;
        const jadwal = state.data.jadwal.find((j) => j.id === sesi.jadwal_id);
        const showScore = jadwal?.tampilkan_nilai !== false;
        state.modalHtml = `
          <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
              <div class="flex items-center justify-between">
                <h3 class="font-extrabold text-base text-slate-900">Rincian Hasil Ujian</h3>
                <button type="button" onclick="window.appActions.closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
              </div>
              <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-center">
                <div class="text-[11px] font-bold text-emerald-700">${escapeHtml(jadwal?.nama_ujian || "Ujian CBT")}</div>
                <div class="text-3xl font-extrabold text-emerald-700 mt-1">${
                  showScore ? Number(sesi.nilai_akhir || 0).toFixed(1) : "Terkumpul"
                }</div>
                <div class="text-[11px] text-emerald-600 mt-1">Status: Selesai Dikerjakan</div>
              </div>
              <button type="button" onclick="window.appActions.closeModal()" class="w-full py-3 rounded-xl bg-[#1D63ED] text-white font-extrabold">Tutup</button>
            </div>
          </div>
        `;
        render();
      }

        const existingCount = state.data.butirSoal.filter((s) => s.bank_soal_id === state.selectedBankId).length;
        const imported = parseWordSoalLines(lines, state.selectedBankId, existingCount + 1);

          state.data.butirSoal.push(...imported);

            const dbRows = imported.map(({ link_url: _l, ...rest }) => rest);

            if (error) await supabase.from("butir_soal").insert(dbRows);
          }
          showToast(`${imported.length} butir soal berhasil diimpor dari Word!`, "success");

        showToast(`Gagal membaca file Word: ${err.message}`, "error");

      for (const r of rows) {

        const rombelName = String(r.nama_rombel || r.kode_kelas || r.nama_kelas || r.kelas || "").trim();
        let kls = state.data.kelas.find(
          (k) => String(k.nama_kelas || "").toLowerCase() === rombelName.toLowerCase()
        );
        if (!kls && rombelName) {
          kls = {
            id: generateId(),
            nama_kelas: rombelName,
            tingkat: rombelName.split(" ")[0] || "XII",
            tahun_ajaran: state.data.madrasah.tahun_pelajaran || "2026/2027"

          state.data.kelas.push(kls);
          if (!IS_PREVIEW && supabase) await supabase.from("master_kelas").insert(kls);
        }
        added.push({
          id: generateId(),
          nomor_peserta: nomorPeserta,
          nisn: String(r.nisn || "").trim(),
          nama_siswa: namaSiswa,
          password: String(r.password || "12345").trim(),
          kelas_id: kls?.id || null,

          sesi_ujian: String(r.sesi_ujian || r.sesi || "Sesi 1").trim(),

        <div class="fixed inset-0 z-[9999998] bg-rose-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-2 border-rose-500 space-y-4 text-xs text-center">
            <div class="w-14 h-14 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
              <i data-lucide="shield-alert" class="w-8 h-8"></i>
            </div>
            <div>
              <span class="px-3 py-1 rounded-full bg-rose-100 text-rose-700 font-extrabold text-[11px]">
                PERINGATAN ANTI-CURANG (${state.antiCurangModalAlert.count} / ${state.antiCurangModalAlert.max})
              </span>
              <h3 class="font-extrabold text-lg text-slate-900 mt-2">Aktivitas Terlarang Terdeteksi!</h3>
              <p class="text-slate-600 mt-1.5 leading-relaxed">
                Sistem mendeteksi Anda: <strong class="text-rose-600">${escapeHtml(state.antiCurangModalAlert.alasan)}</strong> pada pukul <strong>${escapeHtml(state.antiCurangModalAlert.waktu)}</strong>.
              </p>
              <p class="text-[11px] text-slate-500 mt-2">
                Peringatan ini telah dikirim ke layar Pengawas Ruang. Jika mencapai batas maksimal, ujian Anda akan <strong>dihentikan dan dikunci otomatis</strong>.
              </p>
            </div>
            <button
              type="button"
              onclick="window.appActions.acknowledgeAntiCurangWarning()"
              class="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs shadow-md"
            >
              Saya Mengerti & Kembali ke Layar Ujian
            </button>
          </div>
        </div>
      `;

      return `${toastHtml}${bannerHtml}${drawerHtml}${antiCurangOverlayHtml}${state.modalHtml || ""}`;
    }

    function render() {
      const root = document.getElementById("cbt-madrasah-root");
      if (!root) return;

      let screenHtml = "";
      if (!state.currentUser) {
        screenHtml = renderLoginScreen();
      } else if (state.currentUser.role === "peserta") {
        screenHtml = renderStudentPortal();
      } else {
        screenHtml = renderStaffLayout();
      }

      root.innerHTML = `${screenHtml}${renderOverlays()}`;

      if (window.lucide && typeof window.lucide.createIcons === "function") {
        try {
          window.lucide.createIcons();
        } catch (_err) {}
      }
    }

    async function bootstrapApp() {
      render();
      if (!IS_PREVIEW && supabase) {
        await loadAllSupabaseData();
        initSupabaseRealtime();
      }
    }

    bootstrapApp();
  </script>
</body>
</html>
