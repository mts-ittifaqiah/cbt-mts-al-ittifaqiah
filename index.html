        return {

          madrasah: { ...base.madrasah, ...(parsed.madrasah || {}) }

      } catch (_err) {

    function generateId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function generateRandomToken() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "";
      for (let i = 0; i < 6; i++) {
        out += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return out;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function containsArabic(text) {
      return /[\u0600-\u06FF]/.test(String(text || ""));
    }

    function formatScheduleRange(j) {
      if (!j?.waktu_mulai) return "Jadwal belum ditentukan";
      const start = new Date(j.waktu_mulai);
      if (Number.isNaN(start.getTime())) return "Jadwal belum ditentukan";
      const end = j.waktu_selesai
        ? new Date(j.waktu_selesai)
        : new Date(start.getTime() + Number(j.durasi_menit || 60) * 60000);

      const tglStr = start.toLocaleDateString("id-ID", {
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
      const jamMulai = start.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }).replace(":", ".");
      const jamSelesai = end.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }).replace(":", ".");
      return `${tglStr} • ${jamMulai} - ${jamSelesai} WIB`;
    }

    function optimizeLogoDataUrl(dataUrl, maxDim = 420) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let w = img.naturalWidth || maxDim;
          let h = img.naturalHeight || maxDim;
          if (w > maxDim || h > maxDim) {
            if (w >= h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          if (ctx) {
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/png"));
          } else {
            resolve(dataUrl);
          }
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    function showToast(message, type = "info") {
      const id = generateId();
      state.toasts.push({ id, message, type });
      render();
      setTimeout(() => {

    function refreshExpiredTokens() {
      const now = Date.now();
      let changed = false;
      state.data.jadwal.forEach((j) => {
        if (j.status_jadwal === "aktif" && j.token_auto_rotate) {
          const intervalMs = Number(j.token_interval_menit || 15) * 60000;
          const updatedTs = new Date(j.token_updated_at || 0).getTime();
          if (now - updatedTs >= intervalMs) {
            j.token_ujian = generateRandomToken();
            j.token_updated_at = new Date().toISOString();
            changed = true;
          }
        }
      });
      if (changed) saveStateToLocalStorage();
    }

    function getActiveTokenRemainingLabel() {
      const activeJ = state.data.jadwal.find((j) => j.status_jadwal === "aktif");
      if (!activeJ) return "15:00";
      const intervalMs = Number(activeJ.token_interval_menit || 15) * 60000;
      const updatedTs = new Date(activeJ.token_updated_at || Date.now()).getTime();
      const remSec = Math.max(0, Math.floor((updatedTs + intervalMs - Date.now()) / 1000));
      const mm = String(Math.floor(remSec / 60)).padStart(2, "0");
      const ss = String(remSec % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function recalculateSessionScore(sesiId) {
      const sesi = state.data.sesi.find((s) => s.id === sesiId);
      if (!sesi) return;
      const jadwal = state.data.jadwal.find((j) => j.id === sesi.jadwal_id);
      const bankSoalList = state.data.butirSoal.filter((b) => b.bank_soal_id === jadwal?.bank_soal_id);
      const totalBobot = bankSoalList.reduce((acc, b) => acc + Number(b.bobot_nilai || 10), 0);

      let earnedObjektif = 0;
      let earnedEsai = 0;

      bankSoalList.forEach((soal) => {
        const jw = state.data.jawaban.find((x) => x.sesi_id === sesiId && x.soal_id === soal.id);
        const skor = Number(jw?.skor_diperoleh || 0);
        if (soal.tipe_soal === "esai") earnedEsai += skor;
        else earnedObjektif += skor;
      });

      if (totalBobot > 0) {
        sesi.nilai_pg = Number(((earnedObjektif / totalBobot) * 100).toFixed(2));
        sesi.nilai_esai = Number(((earnedEsai / totalBobot) * 100).toFixed(2));
        sesi.nilai_akhir = Number((((earnedObjektif + earnedEsai) / totalBobot) * 100).toFixed(2));
      } else {
        sesi.nilai_pg = 0;
        sesi.nilai_esai = 0;
        sesi.nilai_akhir = 0;
      }
    }

    function parseMatchingPairs(soal) {
      const raw = String(soal.opsi_a || soal.kunci_jawaban || "");
      const lines = raw
        .split(/\r?\n|;/)
        .map((x) => x.trim())
        .filter(Boolean);
      const leftItems = [];
      const rightItems = [];
      lines.forEach((line, idx) => {
        const parts = line.split(/=>|->|=|\|/);
        const left = (parts[0] || `Pernyataan ${idx + 1}`).trim();
        const right = (parts[1] || `Pasangan ${idx + 1}`).trim();
        leftItems.push({ left, right });
        rightItems.push({ right });
      });

      const seedStr = String(soal.id || "cbt");
      let seed = 0;
      for (let i = 0; i < seedStr.length; i++) seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
      const shuffledRight = [...rightItems];
      for (let i = shuffledRight.length - 1; i > 0; i--) {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        const j = seed % (i + 1);
        [shuffledRight[i], shuffledRight[j]] = [shuffledRight[j], shuffledRight[i]];
      }

      return { leftItems, rightItems: shuffledRight };
    }

    function parseStudentMatchingMap(ansStr) {
      const map = {};
      String(ansStr || "")
        .split(";")
        .map((x) => x.trim())
        .filter(Boolean)
        .forEach((pair) => {
          const idx = pair.indexOf("=>");
          if (idx > -1) {
            map[pair.slice(0, idx).trim()] = pair.slice(idx + 2).trim();
          }
        });
      return map;
    }

    function normalizeTrueFalseToken(val) {
      const clean = String(val || "").split("||")[0].trim().toUpperCase();
      if (["A", "BENAR", "BETUL", "TRUE", "B"].includes(clean)) return "BENAR";
      if (["B", "SALAH", "FALSE", "S"].includes(clean)) return "SALAH";
      return clean;
    }

    function gradeQuestion(soal, rawAnswer) {
      const tipe = soal.tipe_soal || "pg";
      const ans = String(rawAnswer || "").trim();
      const key = String(soal.kunci_jawaban || "").trim();
      const bobot = Number(soal.bobot_nilai || 10);

      if (!ans) return { isBenar: false, skor: 0 };

      if (tipe === "pg") {
        const isBenar = ans.toUpperCase() === key.toUpperCase();
        return { isBenar, skor: isBenar ? bobot : 0 };
      }

      if (tipe === "benar_salah") {
        const normAns = normalizeTrueFalseToken(ans);
        const normKey = normalizeTrueFalseToken(key);
        const isBenar = Boolean(normAns) && normAns === normKey;
        return { isBenar, skor: isBenar ? bobot : 0 };
      }

      if (tipe === "pgk") {
        const ansSet = new Set(ans.toUpperCase().split(",").map((x) => x.trim()).filter(Boolean));
        const keySet = new Set(key.toUpperCase().split(",").map((x) => x.trim()).filter(Boolean));
        if (keySet.size === 0) return { isBenar: false, skor: 0 };
        const exact = ansSet.size === keySet.size && [...keySet].every((k) => ansSet.has(k));
        return { isBenar: exact, skor: exact ? bobot : 0 };
      }

      if (tipe === "isian") {
        const validKeys = key.split("|").map((k) => k.trim().toLowerCase()).filter(Boolean);
        const isBenar = validKeys.includes(ans.toLowerCase());
        return { isBenar, skor: isBenar ? bobot : 0 };
      }

      if (tipe === "menjodohkan") {
        const { leftItems } = parseMatchingPairs(soal);
        if (leftItems.length === 0) return { isBenar: false, skor: 0 };
        const userMap = parseStudentMatchingMap(ans);
        let correctCount = 0;
        leftItems.forEach((item) => {
          if (String(userMap[item.left] || "").toLowerCase() === String(item.right || "").toLowerCase()) {
            correctCount++;
          }
        });
        const ratio = correctCount / leftItems.length;
        return { isBenar: ratio === 1, skor: Number((bobot * ratio).toFixed(2)) };
      }

      return { isBenar: false, skor: 0 };
    }

    function splitDelimitedLine(line, sep) {
      const result = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === sep && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseDelimitedText(text) {
      const cleanText = String(text || "").replace(/^\uFEFF/, "");
      const rawLines = cleanText
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l && !l.startsWith("#") && !/^sep\s*=/i.test(l));
      if (rawLines.length < 2) return [];
      const sep = rawLines[0].includes(";") ? ";" : rawLines[0].includes("\t") ? "\t" : ",";
      const headers = splitDelimitedLine(rawLines[0], sep).map((h) =>
        h.toLowerCase().replace(/[^a-z0-9_]/g, "_").replace(/^_+|_+$/g, "")
      );
      return rawLines.slice(1).map((line) => {
        const cols = splitDelimitedLine(line, sep);
        const row = {};
        headers.forEach((h, i) => {
          row[h] = cols[i] ?? "";
        });
        return row;
      });
    }

    function triggerCsvDownload(filename, headers, sampleRows) {
      const escapeCsvCell = (val) => {
        const str = String(val ?? "");
        if (str.includes(";") || str.includes('"') || str.includes("\n")) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      };
      const lines = [
        headers.map(escapeCsvCell).join(";"),
        ...sampleRows.map((r) => r.map(escapeCsvCell).join(";"))
      ];
      const csvContent = "\uFEFF" + lines.join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function normalizeSpreadsheetRowKeys(rawRow) {
      const normalized = {};
      Object.entries(rawRow || {}).forEach(([k, v]) => {
        const cleanKey = String(k || "")
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9_]/g, "_")
          .replace(/_+/g, "_")
          .replace(/^_+|_+$/g, "");
        if (cleanKey) {
          normalized[cleanKey] = String(v ?? "").trim();
        }
      });
      return normalized;
    }

    async function parseSpreadsheetFile(file) {
      if (window.XLSX) {
        try {
          const buf = await file.arrayBuffer();
          const wb = window.XLSX.read(buf, { type: "array" });
          const firstSheet = wb.SheetNames[0];
          if (firstSheet && wb.Sheets[firstSheet]) {
            const jsonRows = window.XLSX.utils.sheet_to_json(wb.Sheets[firstSheet], {
              defval: "",
              raw: false
            });
            const normalizedRows = jsonRows
              .map(normalizeSpreadsheetRowKeys)
              .filter((r) => Object.values(r).some((val) => String(val).trim() !== ""));
            if (normalizedRows.length > 0) return normalizedRows;
          }
        } catch (_err) {
          // Lanjut ke parser HTML table / CSV di bawah
        }
      }

      const text = await file.text();
      if (/<table|<tr|<td|<th/i.test(text)) {
        const doc = new DOMParser().parseFromString(text, "text/html");
        const trs = Array.from(doc.querySelectorAll("tr"));
        if (trs.length >= 2) {
          const headers = Array.from(trs[0].querySelectorAll("th, td")).map((cell) =>
            String(cell.textContent || "")
              .toLowerCase()
              .trim()
              .replace(/[^a-z0-9_]/g, "_")
              .replace(/_+/g, "_")
              .replace(/^_+|_+$/g, "")
          );
          return trs
            .slice(1)
            .map((tr) => {
              const cells = Array.from(tr.querySelectorAll("td, th"));
              const row = {};
              headers.forEach((h, i) => {
                if (h) row[h] = String(cells[i]?.textContent || "").trim();
              });
              return row;
            })
            .filter((r) => Object.values(r).some((val) => String(val).trim() !== ""));
        }
      }

      return parseDelimitedText(text);
    }

    async function extractLinesFromWordFile(file) {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      const isZipDocx = bytes.length >= 2 && bytes[0] === 0x50 && bytes[1] === 0x4b;

      if (isZipDocx && window.JSZip) {
        const zip = await window.JSZip.loadAsync(buf);
        const docXmlFile = zip.file("word/document.xml");
        if (!docXmlFile) throw new Error("Berkas word/document.xml tidak ditemukan.");
        const xmlText = await docXmlFile.async("string");
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "application/xml");
        const paragraphs = Array.from(xmlDoc.getElementsByTagName("w:p"));
        return paragraphs
          .map((p) =>
            Array.from(p.getElementsByTagName("w:t"))
              .map((t) => t.textContent || "")
              .join("")
              .trim()
          )
          .filter(Boolean);
      }

      const text = new TextDecoder("utf-8").decode(bytes);
      if (/<html|<body|<p|<div|<td/i.test(text)) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, "text/html");
        const blocks = Array.from(doc.querySelectorAll("p, li, tr, div.soal-line"));
        const lines = [];
        blocks.forEach((el) => {
          if (el.tagName === "TR") {
            const cells = Array.from(el.querySelectorAll("td, th")).map((c) => c.textContent.trim()).filter(Boolean);
            if (cells.length >= 2) lines.push(cells.join(" => "));
            else if (cells.length === 1) lines.push(cells[0]);
          } else if (!el.querySelector("p, tr")) {
            const txt = el.textContent.replace(/\s+/g, " ").trim();
            if (txt) lines.push(txt);
          }
        });
        if (lines.length > 0) return lines;
      }

      return text
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter(Boolean);
    }

    function parseWordSoalLines(lines, bankSoalId, startNumber = 1) {
      const result = [];
      let current = null;
      let nomor = startNumber;

      const pushCurrent = () => {
        if (!current || !current.pertanyaan) return;
        const tipe = current.tipe_soal || "pg";
        let opsiA = current.opsi_a || "";
        let opsiB = current.opsi_b || "";
        let opsiC = current.opsi_c || "";
        let opsiD = current.opsi_d || "";
        let opsiE = current.opsi_e || "";
        let kunci = current.kunci_jawaban || "A";

        if (tipe === "benar_salah") {
          opsiA = opsiA || "Benar";
          opsiB = opsiB || "Salah";
          kunci = normalizeTrueFalseToken(kunci) || "BENAR";
        } else if (tipe === "menjodohkan" && current.matching_lines?.length > 0) {
          opsiA = current.matching_lines.join("; ");
          kunci = current.matching_lines.join("; ");
        }

        result.push({
          id: generateId(),
          bank_soal_id: bankSoalId,
          nomor_urut: nomor++,
          tipe_soal: tipe,
          pertanyaan: current.pertanyaan.trim(),
          gambar_url: current.gambar_url || "",
          link_url: current.link_url || "",
          opsi_a: opsiA,
          opsi_b: opsiB,
          opsi_c: opsiC,
          opsi_d: opsiD,
          opsi_e: opsiE,
          kunci_jawaban: kunci,
          bobot_nilai: Number(current.bobot_nilai || 10)
        });
      };

      for (const line of lines) {
        const qMatch = line.match(/^(\d+)[\.\)]\s+(.+)$/);
        if (qMatch) {
          pushCurrent();
          current = {
            pertanyaan: qMatch[2],
            tipe_soal: "pg",
            kunci_jawaban: "A",
            bobot_nilai: 10,
            gambar_url: "",
            link_url: "",
            matching_lines: []
          };
          continue;
        }
        if (!current) continue;

        const tipeMatch = line.match(/^TIPE\s*[:=]\s*(.+)$/i);
        if (tipeMatch) {
          const tRaw = tipeMatch[1].trim().toLowerCase().replace(/[\s\/-]+/g, "_");
          if (["pg", "pilihan_ganda"].includes(tRaw)) current.tipe_soal = "pg";
          else if (["pgk", "pg_kompleks", "pilihan_ganda_kompleks"].includes(tRaw)) current.tipe_soal = "pgk";
          else if (["benar_salah", "bs", "betul_salah", "true_false"].includes(tRaw)) current.tipe_soal = "benar_salah";
          else if (["isian", "isian_singkat"].includes(tRaw)) current.tipe_soal = "isian";
          else if (["menjodohkan", "matching", "pasangan"].includes(tRaw)) current.tipe_soal = "menjodohkan";
          else if (["esai", "uraian"].includes(tRaw)) current.tipe_soal = "esai";
          continue;
        }

        const optMatch = line.match(/^([A-Ea-e])[\.\)]\s+(.+)$/);
        if (optMatch) {
          const key = `opsi_${optMatch[1].toLowerCase()}`;
          current[key] = optMatch[2].trim();
          continue;
        }

        const ansMatch = line.match(/^(?:KUNCI|JAWABAN)\s*[:=]\s*(.+)$/i);
        if (ansMatch) {
          current.kunci_jawaban = ansMatch[1].trim();
          continue;
        }

        const bobotMatch = line.match(/^BOBOT\s*[:=]\s*(\d+(?:\.\d+)?)$/i);
        if (bobotMatch) {
          current.bobot_nilai = Number(bobotMatch[1]);
          continue;
        }

        const imgMatch = line.match(/^GAMBAR\s*[:=]\s*(.+)$/i);
        if (imgMatch) {
          current.gambar_url = imgMatch[1].trim();
          continue;
        }

        const linkMatch = line.match(/^LINK\s*[:=]\s*(.+)$/i);
        if (linkMatch) {
          current.link_url = linkMatch[1].trim();
          continue;
        }

        if (current.tipe_soal === "menjodohkan" && /=>|->/.test(line)) {
          current.matching_lines.push(line.replace(/->/g, "=>").trim());
          continue;
        }

        current.pertanyaan += "\n" + line;
      }

      pushCurrent();
      return result;
    }

    function initSupabaseRealtime() {
      if (IS_PREVIEW || !supabase) return;
      try {
        supabase
          .channel("cbt-madrasah-realtime")
          .on("postgres_changes", { event: "*", schema: "public", table: "sesi_peserta" }, (payload) => {
            if (payload.eventType === "DELETE") {
              state.data.sesi = state.data.sesi.filter((s) => s.id !== payload.old?.id);
            } else if (payload.new) {
              const idx = state.data.sesi.findIndex((s) => s.id === payload.new.id);
              if (idx >= 0) state.data.sesi[idx] = payload.new;
              else state.data.sesi.unshift(payload.new);
            }
            saveStateToLocalStorage();
            render();
          })
          .on("postgres_changes", { event: "*", schema: "public", table: "jadwal_ujian" }, (payload) => {
            if (payload.eventType === "DELETE") {
              state.data.jadwal = state.data.jadwal.filter((j) => j.id !== payload.old?.id);
            } else if (payload.new) {
              const idx = state.data.jadwal.findIndex((j) => j.id === payload.new.id);
              if (idx >= 0) state.data.jadwal[idx] = payload.new;
              else state.data.jadwal.unshift(payload.new);
            }
            saveStateToLocalStorage();
            render();
          })
          .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifikasi_siswa" }, (payload) => {
            const n = payload.new;
            if (!n || state.currentUser?.role !== "peserta") return;
            const me = state.currentUser.profile;
            const matchPeserta = n.target_peserta_id && n.target_peserta_id === me.id;
            const matchKelas = n.target_kelas_id && n.target_kelas_id === me.kelas_id;
            const broadcastAll = !n.target_peserta_id && !n.target_kelas_id;
            if (matchPeserta || matchKelas || broadcastAll) {
              triggerSiswaBanner(n);
            }
          })
          .subscribe();
      } catch (_err) {}
    }

    function isStudentActivelyTakingExam() {

    async function recordTabViolation(alasan) {
      if (!isStudentActivelyTakingExam()) return;
      const { jadwal, sesi, peserta } = state.activeExam;
      if (jadwal.anti_contek === false || sesi.status_sesi !== "mengerjakan") return;

      const now = Date.now();
      if (now - lastViolationTs < 2200) return;
      lastViolationTs = now;

      sesi.jumlah_pelanggaran = Number(sesi.jumlah_pelanggaran || 0) + 1;
      const maxPel = Number(jadwal.max_pelanggaran || 3);
      const waktu = new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const logEntry = { waktu, alasan };
      sesi.log_pelanggaran = Array.isArray(sesi.log_pelanggaran) ? [...sesi.log_pelanggaran, logEntry] : [logEntry];

      const kls = state.data.kelas.find((k) => k.id === peserta.kelas_id);
      state.tabAlerts.unshift({
        nama_siswa: peserta.nama_siswa,
        kelas_nama: kls?.nama_kelas || "-",
        alasan,
        count: sesi.jumlah_pelanggaran,
        max: maxPel,
        waktu
      });
      state.unreadTabAlertCount++;

      if (sesi.jumlah_pelanggaran >= maxPel) {
        sesi.status_sesi = "terkunci";
        sesi.log_pelanggaran.push({
          waktu,
          alasan: "Ujian dihentikan & dikunci otomatis karena melewati batas pelanggaran anti-curang"
        });
        state.activeExam = null;
        state.antiCurangModalAlert = null;
        showToast("Sesi ujian Anda DIHENTIKAN & TERKUNCI otomatis karena melewati batas pelanggaran!", "error");
      } else {
        state.antiCurangModalAlert = {
          alasan,
          count: sesi.jumlah_pelanggaran,
          max: maxPel,
          waktu
        };
        showToast(`Peringatan Anti-Curang (${sesi.jumlah_pelanggaran}/${maxPel}): ${alasan}`, "error");
      }

      saveStateToLocalStorage();
      saveAuthSessionToStorage();
      if (!IS_PREVIEW && supabase) {
        await supabase
          .from("sesi_peserta")
          .update({
            jumlah_pelanggaran: sesi.jumlah_pelanggaran,
            log_pelanggaran: sesi.log_pelanggaran,
            status_sesi: sesi.status_sesi
          })
          .eq("id", sesi.id);
      }
      render();
    }

          const sec = state.activeExam.remainingSeconds;
          const mm = String(Math.floor(sec / 60)).padStart(2, "0");
          const ss = String(sec % 60).padStart(2, "0");
          timerEl.textContent = `${mm}:${ss}`;
        }
        if (state.activeExam.remainingSeconds === 0) {
          window.appActions.finishStudentExam(true);
        }
      }

    // =========================================================================
    // 9. SEMUA PENGGUNA (KELOMPOK PESERTA PER ROMBEL + AKSES PENUH ADMIN)
    // =========================================================================
    function renderSemuaPenggunaPage() {
      const q = state.penggunaSearch.trim().toLowerCase();

      const filteredPeserta = state.data.peserta
        .filter((p) => state.pesertaRombelFilter === "all" || (p.kelas_id || "none") === state.pesertaRombelFilter)
        .filter(
          (p) =>
            !q ||
            String(p.nama_siswa || "").toLowerCase().includes(q) ||
            String(p.nomor_peserta || "").toLowerCase().includes(q) ||
            String(p.nisn || "").toLowerCase().includes(q)
        )
        .sort((a, b) => String(a.nomor_peserta).localeCompare(String(b.nomor_peserta)));

      const groupedGroups = [];
      state.data.kelas.forEach((k) => {
        const members = filteredPeserta.filter((p) => p.kelas_id === k.id);
        if (members.length > 0 || state.pesertaRombelFilter === k.id) {
          groupedGroups.push({ id: k.id, title: k.nama_kelas, tingkat: k.tingkat, members });
        }
      });
      const unassigned = filteredPeserta.filter((p) => !p.kelas_id || !state.data.kelas.some((k) => k.id === p.kelas_id));
      if (unassigned.length > 0 || state.pesertaRombelFilter === "none") {
        groupedGroups.push({ id: "none", title: "Belum Dikelompokkan ke Rombel", tingkat: "-", members: unassigned });
      }

      const filteredStaff = state.data.staff.filter(
        (s) =>
          !q ||
          String(s.nama_lengkap || "").toLowerCase().includes(q) ||
          String(s.email || "").toLowerCase().includes(q) ||
          String(s.nip || "").toLowerCase().includes(q)
      );

      return `
        <div class="max-w-[1440px] mx-auto space-y-5 text-xs">
          <div class="bento-card p-4 sm:p-5 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onclick="window.appActions.setUserSubTab('siswa')"
                class="px-4 py-2 rounded-xl font-extrabold transition-all ${
                  state.userSubTab === "siswa" ? "bg-[#1D63ED] text-white shadow-xs" : "bg-slate-100 text-slate-600"
                }"
              >
                Peserta Ujian (${state.data.peserta.length})
              </button>
              <button
                type="button"
                onclick="window.appActions.setUserSubTab('staff')"
                class="px-4 py-2 rounded-xl font-extrabold transition-all ${
                  state.userSubTab === "staff" ? "bg-[#1D63ED] text-white shadow-xs" : "bg-slate-100 text-slate-600"
                }"
              >
                Guru, Pengawas & Admin (${state.data.staff.length})
              </button>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <input
                type="text"
                value="${escapeHtml(state.penggunaSearch)}"
                oninput="window.appActions.setSearchField('penggunaSearch', this.value)"
                placeholder="Cari nama, nomor peserta, email..."
                class="px-3.5 py-2 rounded-xl border border-slate-200 font-semibold w-56"
              />
              ${
                state.userSubTab === "siswa"
                  ? `
                <select
                  onchange="window.appActions.setSearchField('pesertaRombelFilter', this.value)"
                  class="px-3 py-2 rounded-xl border border-slate-200 font-bold bg-white"
                >
                  <option value="all">Semua Rombel</option>
                  ${state.data.kelas
                    .map(
                      (k) =>
                        `<option value="${k.id}" ${state.pesertaRombelFilter === k.id ? "selected" : ""}>${escapeHtml(k.nama_kelas)}</option>`
                    )
                    .join("")}
                  <option value="none" ${state.pesertaRombelFilter === "none" ? "selected" : ""}>Tanpa Rombel</option>
                </select>
                <button type="button" onclick="window.appActions.executePrintPdf('kartu_peserta')" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold inline-flex items-center gap-1.5">
                  <i data-lucide="printer" class="w-3.5 h-3.5"></i> Cetak Kartu
                </button>
                <button type="button" onclick="window.appActions.downloadPesertaTemplate()" class="px-3.5 py-2 rounded-xl bg-blue-50 hover:bg-[#1D63ED] text-[#1D63ED] hover:text-white font-extrabold inline-flex items-center gap-1.5">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Template
                </button>
                <button type="button" onclick="document.getElementById('hidden-template-uploader')?.click()" class="px-3.5 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white font-extrabold inline-flex items-center gap-1.5">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i> Upload
                </button>
                <button type="button" onclick="window.appActions.openPesertaModal()" class="px-4 py-2 rounded-xl bg-[#1D63ED] text-white font-extrabold inline-flex items-center gap-1.5">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Peserta
                </button>
              `
                  : `
                <button type="button" onclick="window.appActions.downloadStaffTemplate()" class="px-3.5 py-2 rounded-xl bg-blue-50 hover:bg-[#1D63ED] text-[#1D63ED] hover:text-white font-extrabold inline-flex items-center gap-1.5">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Template
                </button>

                  <i data-lucide="upload" class="w-3.5 h-3.5"></i> Upload
                </button>
                <button type="button" onclick="window.appActions.openStaffModal()" class="px-4 py-2 rounded-xl bg-[#1D63ED] text-white font-extrabold inline-flex items-center gap-1.5">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Staff
                </button>
              `
              }
            </div>
          </div>

          ${
            state.userSubTab === "siswa"
              ? groupedGroups.length === 0
                ? `<div class="bento-card p-12 text-center text-slate-400">Belum ada data peserta ujian. Klik "Tambah Peserta" atau unggah template Excel.</div>`
                : groupedGroups
                    .map((grp) => {
                      const isCollapsed = state.collapsedRombelIds.includes(grp.id);
                      return `

    function syncDraftPesertaUjianSelection(jadwalId) {
      if (!jadwalId) return;
      if (state.draftPesertaUjianInitializedFor === jadwalId) return;
      const jadwal = state.data.jadwal.find((j) => j.id === jadwalId);
      if (!jadwal) return;

      if (Array.isArray(jadwal.peserta_ids)) {
        state.draftSelectedPesertaUjianIds = [...jadwal.peserta_ids];
      } else {
        state.draftSelectedPesertaUjianIds = state.data.peserta
          .filter((p) => !jadwal.kelas_id || p.kelas_id === jadwal.kelas_id)
          .filter((p) => {
            const targetSesi = jadwal.sesi_ujian || "Semua Sesi";
            return targetSesi === "Semua Sesi" || (p.sesi_ujian || "Sesi 1") === targetSesi;
          })
          .map((p) => p.id);
      }
      state.draftPesertaUjianInitializedFor = jadwalId;
    }

    // =========================================================================
    // 13. LIVE MONITORING PENGAWASAN REAL-TIME (SELESAIKAN & PAKSA BERHENTI)
    // =========================================================================
    function renderLiveMonitoringPage() {
      const targetJadwal =
        state.data.jadwal.find((j) => j.id === state.monitoringJadwalId) || state.data.jadwal[0] || null;
      const q = state.monitoringSearch.trim().toLowerCase();

      const rows = state.data.peserta
        .filter((p) => {
          if (!targetJadwal) return true;
          if (Array.isArray(targetJadwal.peserta_ids)) {
            return targetJadwal.peserta_ids.includes(p.id);
          }
          return p.kelas_id === targetJadwal.kelas_id;
        })
        .filter((p) => state.monitoringSesiFilter === "all" || (p.sesi_ujian || "Sesi 1") === state.monitoringSesiFilter)
        .filter((p) => !q || String(p.nama_siswa || "").toLowerCase().includes(q) || String(p.nomor_peserta || "").toLowerCase().includes(q))
        .map((p) => {
          const sesi = targetJadwal
            ? state.data.sesi.find((s) => s.jadwal_id === targetJadwal.id && s.peserta_id === p.id)
            : null;
          return { peserta: p, sesi };
        });

      const activeSesiList = rows.filter((r) => r.sesi && r.sesi.status_sesi === "mengerjakan").map((r) => r.sesi);
      const selectableSesiIds = rows.filter((r) => r.sesi).map((r) => r.sesi.id);
      const allMonitoringChecked =
        selectableSesiIds.length > 0 &&
        selectableSesiIds.every((id) => state.selectedMonitoringSesiIds.includes(id));

      return `
        <div class="max-w-[1440px] mx-auto space-y-5 text-xs">
          <div class="bento-card p-4 sm:p-5 space-y-3.5">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap items-center gap-2.5">
                <select
                  onchange="window.appActions.setSearchField('monitoringJadwalId', this.value)"
                  class="px-3.5 py-2.5 rounded-xl border border-slate-200 font-bold bg-white"
                >
                  ${
                    state.data.jadwal.length === 0
                      ? `<option value="">-- Belum ada jadwal ujian --</option>`
                      : state.data.jadwal
                          .map(
                            (j) =>
                              `<option value="${j.id}" ${targetJadwal?.id === j.id ? "selected" : ""}>${escapeHtml(j.nama_ujian)}</option>`
                          )
                          .join("")
                  }
                </select>

                <select
                  onchange="window.appActions.setSearchField('monitoringSesiFilter', this.value)"
                  class="px-3.5 py-2.5 rounded-xl border border-slate-200 font-bold bg-white"
                >
                  <option value="all">Semua Sesi</option>
                  ${["Sesi 1", "Sesi 2", "Sesi 3", "Sesi 4"]
                    .map((s) => `<option value="${s}" ${state.monitoringSesiFilter === s ? "selected" : ""}>${s}</option>`)
                    .join("")}
                </select>

                <input
                  type="text"
                  value="${escapeHtml(state.monitoringSearch)}"
                  oninput="window.appActions.setSearchField('monitoringSearch', this.value)"
                  placeholder="Cari peserta..."
                  class="px-3.5 py-2.5 rounded-xl border border-slate-200 font-semibold"
                />
              </div>

              <div class="flex flex-wrap items-center gap-2">
                ${
                  activeSesiList.length > 0
                    ? `
                  <button
                    type="button"
                    onclick="window.appActions.confirmBulkSessionControl('finish', 'all')"
                    class="px-3.5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold inline-flex items-center gap-1.5 shadow-xs"
                  >
                    <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Selesaikan Semua (${activeSesiList.length})
                  </button>
                  <button
                    type="button"
                    onclick="window.appActions.confirmBulkSessionControl('force_stop', 'all')"
                    class="px-3.5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold inline-flex items-center gap-1.5 shadow-xs"
                  >
                    <i data-lucide="octagon-alert" class="w-3.5 h-3.5"></i> Paksa Berhenti Semua (${activeSesiList.length})
                  </button>
                `
                    : ""
                }
                <button

    function formatTanggalIndonesiaLengkap(dateObj) {
      const hariList = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      const bulanList = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];
      const d = dateObj instanceof Date && !isNaN(dateObj) ? dateObj : new Date();
      return {
        hari: hariList[d.getDay()],
        tanggal: String(d.getDate()).padStart(2, "0"),
        bulan: bulanList[d.getMonth()],
        tahun: String(d.getFullYear()),
        lengkap: `${hariList[d.getDay()]}, ${String(d.getDate()).padStart(2, "0")} ${bulanList[d.getMonth()]} ${d.getFullYear()}`,
        tanpaHari: `${String(d.getDate()).padStart(2, "0")} ${bulanList[d.getMonth()]} ${d.getFullYear()}`
      };
    }

    function getBeritaAcaraContext() {
      const targetJadwal =
        state.data.jadwal.find((j) => j.id === state.beritaAcaraJadwalId) ||
        state.data.jadwal.find((j) => j.status_jadwal === "aktif") ||
        state.data.jadwal[0] ||
        null;

      const bank = targetJadwal ? state.data.bankSoal.find((b) => b.id === targetJadwal.bank_soal_id) : null;
      const mapel = bank ? state.data.mapel.find((m) => m.id === bank.mapel_id) : null;
      const effectiveKelasId =
        state.beritaAcaraKelasId !== "all" ? state.beritaAcaraKelasId : targetJadwal?.kelas_id || "all";
      const kelas = effectiveKelasId !== "all" ? state.data.kelas.find((k) => k.id === effectiveKelasId) : null;

      const pesertaList = state.data.peserta
        .filter((p) => effectiveKelasId === "all" || p.kelas_id === effectiveKelasId)
        .filter((p) => state.beritaAcaraSesiFilter === "all" || (p.sesi_ujian || "Sesi 1") === state.beritaAcaraSesiFilter)
        .filter((p) => state.beritaAcaraRuang === "all" || (p.ruang_ujian || "Ruang 01") === state.beritaAcaraRuang)
        .sort((a, b) => String(a.nomor_peserta).localeCompare(String(b.nomor_peserta)));

      const attendanceRows = pesertaList.map((p) => {
        const sesi = targetJadwal
          ? state.data.sesi.find((s) => s.jadwal_id === targetJadwal.id && s.peserta_id === p.id)
          : state.data.sesi.find((s) => s.peserta_id === p.id);
        const isHadir = Boolean(sesi && ["mengerjakan", "selesai", "terkunci"].includes(sesi.status_sesi));
        const waktuLoginText = sesi?.waktu_login
          ? new Date(sesi.waktu_login).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }).replace(":", ".") + " WIB"
          : "-";
        const statusKeterangan = !sesi
          ? "Tidak Hadir"
          : sesi.status_sesi === "selesai"
          ? "Hadir (Selesai)"
          : sesi.status_sesi === "terkunci"
          ? "Hadir (Terkunci)"
          : "Hadir (Aktif)";
        return { peserta: p, sesi, isHadir, waktuLoginText, statusKeterangan };
      });

      const hadirCount = attendanceRows.filter((r) => r.isHadir).length;
      const tidakHadirRows = attendanceRows.filter((r) => !r.isHadir);

      const startDateObj = targetJadwal?.waktu_mulai ? new Date(targetJadwal.waktu_mulai) : new Date();
      const endDateObj = targetJadwal?.waktu_selesai
        ? new Date(targetJadwal.waktu_selesai)
        : new Date(startDateObj.getTime() + Number(targetJadwal?.durasi_menit || 90) * 60000);

      const tglInfo = formatTanggalIndonesiaLengkap(startDateObj);
      const fmtJam = (d) => d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }).replace(":", ".");
      const defaultWaktu = `${fmtJam(startDateObj)} - ${fmtJam(endDateObj)} WIB (${targetJadwal?.durasi_menit || 90} Menit)`;

      const assignedIds = Array.isArray(targetJadwal?.pengawas_ids) ? targetJadwal.pengawas_ids : [];
      const pengawas1 =
        state.data.staff.find((s) => s.id === assignedIds[0]) ||
        state.data.staff.find((s) => s.role === "pengawas");
      const pengawas2 =
        state.data.staff.find((s) => s.id === assignedIds[1]) ||
        (state.currentUser?.role === "admin" ? state.currentUser.profile : null);

      const ruangLabel =
        state.beritaAcaraRuang === "all"
          ? Array.from(new Set(pesertaList.map((p) => p.ruang_ujian || "Ruang 01"))).join(", ") || "Ruang 01"
          : state.beritaAcaraRuang;

      return {
        targetJadwal,
        bank,
        mapel,
        kelas,
        ruangLabel,
        tglInfo,
        attendanceRows,
        totalSeharusnya: attendanceRows.length,
        hadirCount,
        tidakHadirCount: tidakHadirRows.length,
        tidakHadirRows,
        hariTanggal: state.beritaAcaraHariTanggal || tglInfo.lengkap,
        waktuPelaksanaan: state.beritaAcaraWaktu || defaultWaktu,
        pengawasNama: state.beritaAcaraPengawasNama || pengawas1?.nama_lengkap || "Pengawas Ruang Ujian",
        pengawasNip: state.beritaAcaraPengawasNip || pengawas1?.nip || "-",
        proktorNama: state.beritaAcaraProktorNama || pengawas2?.nama_lengkap || "Proktor CBT Madrasah",
        proktorNip: state.beritaAcaraProktorNip || pengawas2?.nip || "-",
        catatan: state.beritaAcaraCatatan
      };
    }

    // =========================================================================
    // 17. PORTAL PESERTA UJIAN & LEMBAR KERJA CBT
    // =========================================================================
    function renderStudentQuestionInput(soal, curAns) {
      const tipe = soal.tipe_soal || "pg";
      if (tipe === "pg") {
        return ["A", "B", "C", "D", "E"]
          .filter((opt) => soal[`opsi_${opt.toLowerCase()}`])
          .map((opt) => {
            const text = soal[`opsi_${opt.toLowerCase()}`];
            const selected = curAns.toUpperCase() === opt;
            const isArabic = containsArabic(text);
            return `
              <button
                type="button"
                onclick="window.appActions.saveAnswer('${opt}')"
                class="w-full text-left p-3.5 rounded-2xl border transition-all flex items-center gap-3 ${
                  selected
                    ? "bg-[#EEF4FF] border-[#1D63ED] text-slate-900 shadow-xs"
                    : "bg-white border-slate-200 hover:border-slate-300 text-slate-700"
                }"
              >
                <span class="w-8 h-8 rounded-xl font-extrabold text-xs flex items-center justify-center shrink-0 ${
                  selected ? "bg-[#1D63ED] text-white" : "bg-slate-100 text-slate-600"
                }">${opt}</span>
                <span class="flex-1 font-semibold ${isArabic ? "font-arabic text-right text-lg" : "text-sm"}" dir="${isArabic ? "rtl" : "ltr"}">${escapeHtml(text)}</span>
              </button>
            `;
          })
          .join("");
      }

      if (tipe === "pgk") {
        const selectedSet = new Set(curAns.toUpperCase().split(",").map((x) => x.trim()).filter(Boolean));
        return ["A", "B", "C", "D", "E"]
          .filter((opt) => soal[`opsi_${opt.toLowerCase()}`])
          .map((opt) => {
            const text = soal[`opsi_${opt.toLowerCase()}`];
            const checked = selectedSet.has(opt);
            return `
              <label class="w-full p-3.5 rounded-2xl border cursor-pointer flex items-center gap-3 ${
                checked ? "bg-[#EEF4FF] border-[#1D63ED]" : "bg-white border-slate-200"
              }">
                <input type="checkbox" ${checked ? "checked" : ""} onchange="window.appActions.togglePgkOption('${opt}')" class="w-4 h-4 rounded text-[#1D63ED]" />
                <span class="font-extrabold text-xs text-[#1D63ED]">${opt}.</span>
                <span class="text-sm font-semibold text-slate-800">${escapeHtml(text)}</span>
              </label>
            `;
          })
          .join("");
      }

      if (tipe === "benar_salah") {
        const parts = curAns.split("||");
        const choice = normalizeTrueFalseToken(parts[0] || "");
        const reasonVal = parts.slice(1).join("||");
        const requireReason = soal.opsi_c === "wajib_alasan";
        const labelBenar = soal.opsi_a || "Benar";
        const labelSalah = soal.opsi_b || "Salah";

        return `
          <div class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <button
                type="button"
                onclick="window.appActions.saveTrueFalseAnswer('BENAR')"
                class="p-4 rounded-2xl border font-extrabold text-sm flex items-center justify-center gap-2 transition-all ${
                  choice === "BENAR"
                    ? "bg-emerald-600 text-white border-emerald-600 shadow-sm"
                    : "bg-white text-slate-700 border-slate-200 hover:border-emerald-400"
                }"
              >
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                <span>${escapeHtml(labelBenar)}</span>
              </button>
              <button
                type="button"
                onclick="window.appActions.saveTrueFalseAnswer('SALAH')"
                class="p-4 rounded-2xl border font-extrabold text-sm flex items-center justify-center gap-2 transition-all ${
                  choice === "SALAH"
                    ? "bg-rose-600 text-white border-rose-600 shadow-sm"
                    : "bg-white text-slate-700 border-slate-200 hover:border-rose-400"
                }"
              >
                <i data-lucide="x-circle" class="w-4 h-4"></i>
                <span>${escapeHtml(labelSalah)}</span>
              </button>
            </div>
            ${
              requireReason
                ? `
              <div class="p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200 space-y-1.5">
                <label class="block text-xs font-extrabold text-amber-900">Alasan Pemilihan Jawaban (Wajib Diisi):</label>
                <textarea
                  rows="2"
                  oninput="window.appActions.saveTrueFalseReason(this.value)"
                  placeholder="Tuliskan alasan mengapa pernyataan di atas Benar atau Salah..."
                  class="w-full p-3 rounded-xl border border-amber-200 bg-white text-xs sm:text-sm font-semibold text-slate-800 outline-none focus:border-[#1D63ED]"
                >${escapeHtml(reasonVal)}</textarea>
              </div>
            `
                : ""
            }
          </div>
        `;
      }

      if (tipe === "menjodohkan") {
        const { leftItems, rightItems } = parseMatchingPairs(soal);
        const userMap = parseStudentMatchingMap(curAns);
        return `
          <div class="space-y-3">
            <div class="px-3.5 py-2 rounded-xl bg-[#EEF4FF] border border-blue-200 text-[11px] font-bold text-[#1D63ED] flex items-center justify-between">
              <span>Lajur Kiri (Pernyataan / Soal)</span>
              <span>Lajur Kanan (Pasangan yang Sesuai)</span>
            </div>
            ${leftItems
              .map(
                (item, idx) => `
              <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/70 grid grid-cols-1 sm:grid-cols-12 items-center gap-2.5">
                <div class="sm:col-span-6 flex items-start gap-2">
                  <span class="w-6 h-6 rounded-lg bg-[#1D63ED] text-white text-[11px] font-extrabold flex items-center justify-center shrink-0 mt-0.5">${idx + 1}</span>
                  <span class="text-xs sm:text-sm font-bold text-slate-800">${escapeHtml(item.left)}</span>
                </div>
                <div class="hidden sm:flex sm:col-span-1 justify-center text-slate-400">
                  <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </div>
                <div class="sm:col-span-5">
                  <select
                    onchange="window.appActions.updateMatchingPair('${escapeHtml(item.left)}', this.value)"
                    class="w-full px-3 py-2.5 rounded-xl border ${
                      userMap[item.left] ? "border-[#1D63ED] bg-blue-50/40" : "border-slate-200 bg-white"
                    } text-xs font-extrabold text-[#1D63ED]"
                  >
                    <option value="">-- Pilih Pasangan Lajur Kanan --</option>
                    ${rightItems
                      .map(
                        (r) =>
                          `<option value="${escapeHtml(r.right)}" ${userMap[item.left] === r.right ? "selected" : ""}>${escapeHtml(r.right)}</option>`
                      )
                      .join("")}
                  </select>
                </div>
              </div>
            `
              )
              .join("")}
          </div>
        `;
      }

      return `
        <textarea
          rows="${tipe === "esai" ? 5 : 2}"
          oninput="window.appActions.saveAnswer(this.value, true)"
          placeholder="Ketik jawaban Anda di sini..."
          class="w-full p-4 rounded-2xl border border-slate-200 focus:border-[#1D63ED] outline-none text-sm font-semibold text-slate-800"
        >${escapeHtml(curAns)}</textarea>
      `;
    }

    function renderStudentExamRunner() {
      const { jadwal, peserta, sesi, soalList, currentIndex, remainingSeconds } = state.activeExam;
      const soal = soalList[currentIndex] || soalList[0];
      const ansRec = state.data.jawaban.find((jw) => jw.sesi_id === sesi.id && jw.soal_id === soal?.id);
      const curAns = ansRec?.jawaban_dipilih || "";
      const isRagu = Boolean(ansRec?.is_ragu);
      const isArabic = containsArabic(soal?.pertanyaan || "");

      const mm = String(Math.floor(remainingSeconds / 60)).padStart(2, "0");
      const ss = String(remainingSeconds % 60).padStart(2, "0");

      return `
        <div class="w-full h-full flex flex-col bg-[#F4F7FC] anti-contek-shield">
          <header class="bg-white border-b border-[#E6ECF5] px-4 sm:px-6 py-3 safe-top-pad flex items-center justify-between gap-3 shrink-0">
            <div class="min-w-0">
              <div class="font-extrabold text-sm text-slate-900 truncate">${escapeHtml(jadwal.nama_ujian)}</div>

            <div class="flex items-center gap-2 shrink-0">

                  ? "bg-rose-50 border-rose-200 text-rose-700"

              }">
                <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i>
                <span>Anti-Curang: ${sesi.jumlah_pelanggaran || 0}/${jadwal.max_pelanggaran || 3}</span>
              </div>

              <div class="hidden sm:flex items-center gap-1 bg-slate-100 p-1 rounded-xl">

                <button type="button" onclick="window.appActions.adjustExamFont(0)" class="px-2 py-1 rounded-lg hover:bg-white text-xs font-extrabold">A</button>
                <button type="button" onclick="window.appActions.adjustExamFont(0.1)" class="px-2 py-1 rounded-lg hover:bg-white text-xs font-extrabold">A+</button>
              </div>

              <div class="px-3.5 py-2 rounded-xl bg-[#EEF4FF] text-[#1D63ED] font-mono text-sm font-extrabold flex items-center gap-1.5">
                <i data-lucide="clock" class="w-4 h-4"></i>
                <span id="exam-timer-display">${mm}:${ss}</span>
              </div>
            </div>
          </header>

          <div class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-6">
            <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div class="lg:col-span-8 bento-card p-5 sm:p-7 flex flex-col justify-between space-y-6">
                <div class="space-y-4">
                  <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <span class="px-3 py-1 rounded-xl bg-[#1D63ED] text-white text-xs font-extrabold">
                      Soal Nomor ${currentIndex + 1} dari ${soalList.length}
                    </span>
                    <button
                      type="button"
                      onclick="window.appActions.toggleRaguSoal()"
                      class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition-all ${
                        isRagu ? "bg-amber-400 text-slate-900 border-amber-500" : "bg-amber-50 text-amber-700 border-amber-200"
                      }"
                    >
                      ${isRagu ? "✓ Ditandai Ragu-Ragu" : "Tandai Ragu-Ragu"}
                    </button>
                  </div>

                  <div
                    style="font-size: ${state.examFontScale}rem"
                    class="font-semibold text-slate-900 whitespace-pre-line leading-relaxed ${isArabic ? "font-arabic text-right text-2xl" : ""}"
                    dir="${isArabic ? "rtl" : "ltr"}"
                  >
                    ${escapeHtml(soal?.pertanyaan || "")}
                  </div>

                  ${soal?.gambar_url ? `<img src="${escapeHtml(soal.gambar_url)}" alt="Ilustrasi Soal" class="max-h-64 rounded-2xl border border-slate-200" />` : ""}
                  ${
                    soal?.link_url
                      ? `<div class="p-3 rounded-xl bg-[#EEF4FF] border border-blue-200 flex items-center justify-between gap-2 text-xs">
                          <span class="font-bold text-slate-700">Lampiran / Tautan Pendukung Soal:</span>
                          <a href="${escapeHtml(soal.link_url)}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-lg bg-[#1D63ED] text-white font-extrabold inline-flex items-center gap-1.5 shrink-0">
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Buka Tautan
                          </a>
                        </div>`
                      : ""
                  }

                  <div class="space-y-2.5 pt-2">
                    ${renderStudentQuestionInput(soal, curAns)}

                </div>

                <div class="flex items-center justify-between gap-3 pt-4 border-t border-slate-100">
                  <button
                    type="button"
                    ${currentIndex === 0 ? "disabled" : ""}
                    onclick="window.appActions.goToExamQuestion(${currentIndex - 1})"
                    class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 text-xs font-extrabold inline-flex items-center gap-1.5"
                  >
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Sebelumnya
                  </button>

                  ${
                    currentIndex < soalList.length - 1
                      ? `
                    <button
                      type="button"
                      onclick="window.appActions.goToExamQuestion(${currentIndex + 1})"
                      class="px-5 py-2.5 rounded-xl bg-[#1D63ED] hover:bg-[#1550C8] text-white text-xs font-extrabold inline-flex items-center gap-1.5"
                    >
                      Selanjutnya <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                  `
                      : `
                    <button
                      type="button"
                      onclick="window.appActions.confirmFinishExam()"
                      class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold inline-flex items-center gap-1.5 shadow-sm"
                    >
                      <i data-lucide="check-circle-2" class="w-4 h-4"></i> Selesai & Kumpulkan
                    </button>
                  `
                  }
                </div>
              </div>

              <div class="lg:col-span-4 bento-card p-5 flex flex-col justify-between space-y-5">
                <div>
                  <h3 class="font-extrabold text-sm text-slate-900 mb-3">Navigasi Nomor Soal</h3>
                  <div class="grid grid-cols-5 gap-2">
                    ${soalList
                      .map((item, i) => {
                        const jw = state.data.jawaban.find((x) => x.sesi_id === sesi.id && x.soal_id === item.id);
                        const answered = Boolean(jw && String(jw.jawaban_dipilih || "").trim());
                        const ragu = Boolean(jw?.is_ragu);
                        const active = i === currentIndex;
                        let cls = "bg-slate-100 text-slate-700 border-slate-200";
                        if (ragu) cls = "bg-amber-400 text-slate-900 border-amber-500";

                            onclick="window.appActions.goToExamQuestion(${i})"

                            ${i + 1}
                          </button>

                      })
                      .join("")}

                </div>

                <div class="space-y-3 pt-4 border-t border-slate-100">

                    <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-amber-400"></span>Ragu-Ragu</span>
                  </div>
                  <button
                    type="button"
                    onclick="window.appActions.confirmFinishExam()"
                    class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-xs"
                  >
                    Selesai & Kumpulkan Jawaban
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderStudentPortal() {
      if (state.activeExam) {
        return renderStudentExamRunner();
      }

      const m = state.data.madrasah;
      const peserta = state.currentUser.profile;
      const kelas = state.data.kelas.find((k) => k.id === peserta.kelas_id);
      const mySesiGelombang = peserta.sesi_ujian || "Sesi 1";

      const myJadwalList = state.data.jadwal.filter((j) => {
        if (j.status_jadwal !== "aktif") return false;
        if (Array.isArray(j.peserta_ids)) {
          return j.peserta_ids.includes(peserta.id);
        }
        if (j.kelas_id && peserta.kelas_id && j.kelas_id !== peserta.kelas_id) return false;
        const targetSesi = j.sesi_ujian || "Semua Sesi";
        return targetSesi === "Semua Sesi" || targetSesi === mySesiGelombang;
      });

      return `
        <div class="w-full h-full flex flex-col bg-[#F4F7FC]">

            state.adminOriginUser
              ? `

              <span>Mode Akses Penuh Admin — Sedang Melihat Akun Peserta: ${escapeHtml(peserta.nama_siswa)} (${escapeHtml(peserta.nomor_peserta)})</span>

            </div>
          `
              : ""
          }

            <div class="flex items-center gap-3 min-w-0">
              ${renderAdaptiveLogoHtml("student_header")}
              <div class="min-w-0">
                <div class="font-extrabold text-sm text-slate-900 truncate">${escapeHtml(m.nama_madrasah)}</div>
                <div class="text-[11px] text-slate-500 truncate">
                  ${escapeHtml(peserta.nama_siswa)} (${escapeHtml(peserta.nomor_peserta)}) • ${escapeHtml(kelas?.nama_kelas || "-")} • <strong>${escapeHtml(mySesiGelombang)}</strong>
                </div>
              </div>
            </div>

            <button
              type="button"
              onclick="window.appActions.logout()"
              class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white text-xs font-extrabold transition-all shrink-0"
            >
              Keluar
            </button>
          </header>

          <main class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-8">
            <div class="max-w-4xl mx-auto space-y-5">
              <div class="welcome-banner-gradient rounded-2xl p-5 flex items-center justify-between gap-4">
                <div>
                  <div class="text-xs font-bold text-slate-600">Selamat Mengerjakan Ujian,</div>
                  <h2 class="text-lg sm:text-xl font-extrabold text-[#1D63ED] mt-0.5">${escapeHtml(peserta.nama_siswa)}</h2>
                  <p class="text-xs text-slate-500 mt-1">Gelombang Anda: <strong>${escapeHtml(mySesiGelombang)}</strong> (${escapeHtml(peserta.ruang_ujian || "Ruang 01")}). Pilih jadwal ujian aktif di bawah ini.</p>
                </div>

        state.activeMenu = menuId;
        state.mobileMenuOpen = false;
        saveAuthSessionToStorage();
        render();
      },

      toggleMobileMenu(open) {

      openSetupInitialAdminModal() {
        state.modalHtml = `
          <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
              <div class="flex items-center justify-between">

                <button type="button" onclick="window.appActions.closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4"></i></button>
              </div>
              <form onsubmit="window.appActions.createInitialAdmin(event)" class="space-y-3">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Nama Lengkap Administrator *</label>
                  <input type="text" name="nama_lengkap" required placeholder="Administrator Madrasah" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-bold" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Email Login *</label>
                  <input type="email" name="email" required placeholder="admin@madrasah.sch.id" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-semibold" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Password *</label>
                  <input type="text" name="password" required placeholder="admin123" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 font-mono font-bold" />
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-[#1D63ED] text-white font-extrabold">Buat & Masuk Sekarang</button>
              </form>
            </div>
          </div>

        render();
      },

      createInitialAdmin(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newAdmin = {
          id: generateId(),
          nama_lengkap: String(fd.get("nama_lengkap") || "").trim(),
          email: String(fd.get("email") || "").trim().toLowerCase(),
          nip: "-",
          password: String(fd.get("password") || "").trim(),
          role: "admin"
        };
        state.data.staff.push(newAdmin);
        saveStateToLocalStorage();
        state.modalHtml = null;
        state.currentUser = { role: "admin", profile: newAdmin };
        state.activeMenu = "dashboard";
        saveAuthSessionToStorage();
        showToast("Akun Administrator berhasil dibuat!", "success");
        render();
      },

      async submitLoginPeserta(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const nomor = String(fd.get("nomor_peserta") || "").trim();
        const pass = String(fd.get("password") || "").trim();

        if (!nomor || !pass) {
          showToast("Masukkan Nomor Peserta dan Password!", "error");
          return;
        }

        let found = null;
        if (!IS_PREVIEW && supabase) {
          const { data } = await supabase
            .from("peserta_ujian")
            .select("*")
            .eq("nomor_peserta", nomor)
            .maybeSingle();
          if (data && String(data.password || "").trim() === pass) {
            found = data;
            const idx = state.data.peserta.findIndex((p) => p.id === data.id);
            if (idx >= 0) state.data.peserta[idx] = data;
            else state.data.peserta.push(data);
            saveStateToLocalStorage();
          }
        }

        if (!found) {
          found = state.data.peserta.find(
            (p) => String(p.nomor_peserta || "").trim() === nomor && String(p.password || "").trim() === pass
          );
        }

        if (!found) {
          showToast("Nomor Peserta atau Password tidak sesuai!", "error");
          return;
        }

        if (found.status_aktif === false) {
          showToast("Akun peserta ini sedang dinonaktifkan oleh panitia ujian.", "error");
          return;
        }

        state.currentUser = { role: "peserta", profile: found };
        saveAuthSessionToStorage();
        showToast(`Selamat datang, ${found.nama_siswa}`, "success");
        render();
      },

      async submitLoginStaff(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const identifier = String(fd.get("identifier") || "").trim().toLowerCase();
        const pass = String(fd.get("password") || "").trim();
        const expectedRole = state.loginTab;

        if (!identifier || !pass) {
          showToast("Masukkan Email/NIP dan Password terlebih dahulu.", "error");
          return;
        }

        let staff = null;
        let authDebugHint = "";

        if (!IS_PREVIEW && supabase) {
          if (identifier.includes("@")) {
            const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({
              email: identifier,
              password: pass
            });

            if (authData?.user) {
              const authUser = authData.user;
              const { data: existingProfile } = await supabase
                .from("staff_users")
                .select("*")
                .ilike("email", identifier)
                .maybeSingle();

              if (existingProfile) {
                staff = existingProfile;
                if (!existingProfile.auth_user_id) {
                  await supabase
                    .from("staff_users")
                    .update({ auth_user_id: authUser.id })
                    .eq("id", existingProfile.id);
                }
              } else {
                const newProfile = {
                  id: generateId(),
                  auth_user_id: authUser.id,
                  nama_lengkap:
                    authUser.user_metadata?.full_name ||
                    authUser.user_metadata?.nama_lengkap ||
                    identifier.split("@")[0],
                  email: identifier,
                  nip: "-",
                  password: pass,
                  role: expectedRole
                };
                const { data: insertedProfile } = await supabase
                  .from("staff_users")
                  .insert(newProfile)
                  .select()
                  .maybeSingle();
                staff = insertedProfile || newProfile;
              }
            } else if (authErr) {
              authDebugHint = authErr.message || "";
            }
          }

          if (!staff) {
            let dbRow = null;
            if (identifier.includes("@")) {
              const { data, error } = await supabase
                .from("staff_users")
                .select("*")
                .ilike("email", identifier)
                .maybeSingle();
              if (error) authDebugHint = error.message || authDebugHint;
              dbRow = data;
            } else {
              const { data, error } = await supabase
                .from("staff_users")
                .select("*")
                .eq("nip", identifier)
                .maybeSingle();
              if (error) authDebugHint = error.message || authDebugHint;
              dbRow = data;
            }

            if (dbRow) {
              if (String(dbRow.password || "").trim() === pass) {
                staff = dbRow;
              } else {
                showToast("Password tidak cocok dengan data di tabel staff_users Supabase.", "error");
                return;
              }
            }
          }

          if (staff) {
            const idx = state.data.staff.findIndex((x) => x.id === staff.id);
            if (idx >= 0) state.data.staff[idx] = staff;
            else state.data.staff.push(staff);
            saveStateToLocalStorage();
          }
        }

        if (!staff) {
          staff = state.data.staff.find(
            (s) =>
              (String(s.email || "").trim().toLowerCase() === identifier ||
                String(s.nip || "").trim().toLowerCase() === identifier) &&
              String(s.password || "").trim() === pass
          );
        }

        if (!staff) {
          if (IS_PREVIEW) {
            showToast(
              "Mode Preview aktif (IS_PREVIEW = true). Ubah ke false setelah mengisi URL & Key Supabase, atau klik 'Buat Admin'.",
              "error"
            );
          } else if (authDebugHint) {
            showToast(`Gagal login Supabase: ${authDebugHint}`, "error");
          } else {
            showToast("Email/NIP atau Password tidak ditemukan di Supabase!", "error");
          }
          return;
        }

        const actualRole = String(staff.role || "").trim().toLowerCase();
        if (actualRole !== expectedRole) {
          showToast(
            `Akun ini terdaftar sebagai ${actualRole.toUpperCase()}, silakan pilih tab ${actualRole.toUpperCase()}.`,
            "error"
          );
          return;
        }

        state.currentUser = { role: actualRole, profile: staff };
        state.activeMenu = "dashboard";
        saveAuthSessionToStorage();
        showToast(`Berhasil masuk sebagai ${staff.nama_lengkap}`, "success");
        render();
      },

      async logout() {
        state.currentUser = null;
        state.adminOriginUser = null;

      impersonateUser(role, id) {
        if (!state.adminOriginUser && state.currentUser?.role === "admin") {
          state.adminOriginUser = state.currentUser;
        }
        if (role === "peserta") {
          const p = state.data.peserta.find((x) => x.id === id);
          if (p) {
            state.currentUser = { role: "peserta", profile: p };
            saveAuthSessionToStorage();
            render();
          }
        } else {
          const s = state.data.staff.find((x) => x.id === id);
          if (s) {
            state.currentUser = { role: s.role, profile: s };
            state.activeMenu = "dashboard";
            saveAuthSessionToStorage();
            render();
          }
        }
      },

        if (state.adminOriginUser) {
          state.currentUser = state.adminOriginUser;

          state.activeMenu = "dashboard";

          render();
        }

      async executeAutoSplitSesi(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        const count = Math.max(2, Math.min(4, Number(fd.get("jumlah_sesi") || 2)));
        const sorted = [...state.data.peserta].sort((a, b) =>
          String(a.nomor_peserta).localeCompare(String(b.nomor_peserta))
        );
        const perBatch = Math.ceil(sorted.length / count);

        sorted.forEach((p, idx) => {
          const sesiIdx = Math.min(count, Math.floor(idx / perBatch) + 1);
          p.sesi_ujian = `Sesi ${sesiIdx}`;
        });

        saveStateToLocalStorage();
        if (!IS_PREVIEW && supabase) {
          for (const p of sorted) {
            await supabase.from("peserta_ujian").update({ sesi_ujian: p.sesi_ujian }).eq("id", p.id);
          }
        }
        state.modalHtml = null;
        showToast(`Seluruh peserta berhasil dibagi ke dalam ${count} gelombang sesi!`, "success");
        render();
      },
